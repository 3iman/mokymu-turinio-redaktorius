<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    <div class="k-title">{{title}}</div>
    <div class="k-persona"><div class="k-sil b-sil"><svg viewBox="0 0 230 250"><circle cx="115" cy="82" r="56" fill="#9fb0d0"/><path d="M10 250c0-66 47-104 105-104s105 38 105 104z" fill="#9fb0d0"/></svg></div><div class="k-facts"><div class="k-fact b-f0"><div class="k-fact-l">Amžius</div><div class="k-fact-v">{{amzius}}</div></div><div class="k-fact b-f1"><div class="k-fact-l">Išsilavinimas</div><div class="k-fact-v">{{issilavinimas}}</div></div><div class="k-fact is-wide b-f2"><div class="k-fact-l">Darbas</div><div class="k-fact-v">{{darbas}}</div></div><div class="k-fact is-wide b-f3"><div class="k-fact-l">Komunikacija</div><div class="k-fact-v">{{komunikacija}}</div></div></div></div><div class="k-sum b-summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg><span>{{summary}}</span></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
