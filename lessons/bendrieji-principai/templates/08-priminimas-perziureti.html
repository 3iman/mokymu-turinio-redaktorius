<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K28 — „Priminimas peržiūrėti“ (ep_700_08_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 45% 40%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.tvs-cke-body { min-height: 220px; } .kbd { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 40; padding: 14px 28px; border: 2px solid #333; border-radius: 8px; background: #fff; font: 700 26px var(--tvs-font); box-shadow: 0 4px 0 #333; opacity: 0; }
  .pt { background: #fff; padding: 12px; } .pa { opacity: 0; } .tvs-select { position: relative; } .c-v { position: absolute; left: 18px; color: var(--tvs-text); } .dd-wrap { position: relative; height: 0; z-index: 5; } .cat-dd { position: absolute; left: 0; top: -2px; width: 100%; }
  .dd2 { position: absolute; left: 146px; top: 70px; width: 380px; z-index: 10; } .word { position: absolute; left: 80px; top: 120px; width: 620px; z-index: 6; background: #fff; border: 1px solid #c9c9c9; box-shadow: 0 16px 40px rgba(0,0,0,.2); }
  .word-h { height: 40px; background: #2b579a; color: #fff; display: flex; align-items: center; padding: 0 14px; font: 15px Arial; } .word-b { padding: 24px 28px; font: 20px/1.6 Calibri, Arial; } .sel { background: #b3d4fc; }
  .w-red { color: #d00; font-family: 'Comic Sans MS', cursive; } .w-big { font-size: 26px; font-family: Georgia; } .sv { opacity: 0; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(342.5px, 501.0px); }
  .caret-d { opacity: 1; }
  .cat-dd { opacity: 0; }
  .c-ph { opacity: 0; }
  .c-v { opacity: 1; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window is-nosubnav">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class="is-on"></i><i class="is-bars"></i><i class=""></i><i class=""></i><i class=""></i></div>
        
        <div class="tvs-main">
          <div class="tvs-crumb">Puslapiai  /  Priėmimas į mokyklą  /  Redaguoti</div>
<div class="tvs-tabs"><div class="tvs-tab">Bendri</div><div class="tvs-tab">Turinys</div><div class="tvs-tab" data-t="tabsyn">Sintaksė</div><div class="tvs-tab is-on" data-t="tabaud">Auditas</div></div><div class="tvs-form is-dense" style="padding:10px 18px"><div class="tvs-field" data-t="fd"><div class="tvs-label">Patikrinimo data</div><div class="tvs-date"><span class="tvs-date-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></span><span class="tvs-date-v"><span class="tvs-typed ty-d" data-ty="d"><span class="w"><span class="l l1">2</span><span class="l l2">0</span><span class="l l3">2</span><span class="l l4">7</span><span class="l l5">-</span><span class="l l6">0</span><span class="l l7">3</span><span class="l l8">-</span><span class="l l9">0</span><span class="l l10">1</span></span><span class="l l11">&nbsp;</span><span class="w"><span class="l l12">0</span><span class="l l13">9</span><span class="l l14">:</span><span class="l l15">0</span><span class="l l16">0</span></span></span></span><span class="tvs-date-tz">Europe/Vilnius</span></div></div>
              <div class="tvs-field" data-t="fst"><div class="tvs-label">Statusas</div><div class="tvs-select" data-t="st"><span class="c-ph">Choose an entry...</span><span class="c-v">Peržiūrėti</span></div><div class="dd-wrap"><div class="tvs-select-list cat-dd"><div class="tvs-select-opt">Tvarkinga</div><div class="tvs-select-opt is-hl" data-t="optp">Peržiūrėti</div><div class="tvs-select-opt">Atidėtas</div></div></div></div></div>
          <div class="tvs-form-foot"><span class="tvs-btn is-tiny" data-t="upd"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Atnaujinti</span><span class="tvs-btn is-tiny" data-t="save"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Išsaugoti ir išeiti</span><span class="tvs-sp"></span><span class="tvs-btn is-tiny is-info" data-t="prev"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>Peržiūrėti</span></div>
        </div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="tvs-ripple rp rp2"></div>
      <div class="tvs-ripple rp rp3"></div>
      <div class="tvs-ripple rp rp4"></div>
      <div class="tvs-ripple rp rp5"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
