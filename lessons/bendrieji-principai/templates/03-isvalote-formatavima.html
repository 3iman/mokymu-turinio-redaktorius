<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K26 — „Išvalote formatavimą“ (ep_700_03_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 45% 35%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.tvs-cke-body { min-height: 220px; } .kbd { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 40; padding: 14px 28px; border: 2px solid #333; border-radius: 8px; background: #fff; font: 700 26px var(--tvs-font); box-shadow: 0 4px 0 #333; opacity: 0; }
  .pt { background: #fff; padding: 12px; } .pa { opacity: 0; } .tvs-select { position: relative; } .c-v { position: absolute; left: 18px; color: var(--tvs-text); } .dd-wrap { position: relative; height: 0; z-index: 5; } .cat-dd { position: absolute; left: 0; top: -2px; width: 100%; }
  .dd2 { position: absolute; left: 146px; top: 70px; width: 380px; z-index: 10; } .word { position: absolute; left: 80px; top: 120px; width: 620px; z-index: 6; background: #fff; border: 1px solid #c9c9c9; box-shadow: 0 16px 40px rgba(0,0,0,.2); }
  .word-h { height: 40px; background: #2b579a; color: #fff; display: flex; align-items: center; padding: 0 14px; font: 15px Arial; } .word-b { padding: 24px 28px; font: 20px/1.6 Calibri, Arial; } .sel { background: #b3d4fc; }
  .w-red { color: #d00; font-family: 'Comic Sans MS', cursive; } .w-big { font-size: 26px; font-family: Georgia; } .messy { } .clean { position: absolute; left: 0; top: 0; opacity: 0; } .wrapm { position: relative; } .sa2 { }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(932.6px, 316.0px); }
  .k { opacity: 0; }
  .messy { opacity: 0; }
  .clean { opacity: 1; }

</style>
</head>
<body>

<div class="tvs-tabs"><div class="tvs-tab">Bendri</div><div class="tvs-tab is-on">Turinys</div><div class="tvs-tab" data-t="tabsyn">Sintaksė</div><div class="tvs-tab" data-t="tabaud">Auditas</div></div><div class="tvs-form " style="padding:10px 18px"><div class="tvs-field cke-field"><div class="tvs-label">Turinys</div><div class="tvs-cke" data-t="cke"><div class="tvs-cke-top">

              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-table"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-horizontalrule"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-specialchar"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-pagebreak"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-iframe"></i></span></div></div>

              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-maximize"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-showblocks"></i></span></div>
              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-casechange"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-lowercase"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-uppercase"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-capitalize"></i></span></div></div>
          </div><div class="tvs-cke-body"><div class="wrapm" data-t="txt"><p class="messy">Demo mokyklos <span class="w-red">puslapio</span> <span class="w-big">tekstas</span> su svetimu formatavimu.</p><p class="clean">Demo mokyklos puslapio tekstas su svetimu formatavimu.</p></div></div><div class="tvs-cke-bot"><span>body</span><span>p</span></div></div></div></div>
          <div class="tvs-form-foot"><span class="tvs-btn is-tiny" data-t="upd"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Atnaujinti</span><span class="tvs-btn is-tiny" data-t="save"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Išsaugoti ir išeiti</span><span class="tvs-sp"></span><span class="tvs-btn is-tiny is-info" data-t="prev"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>Peržiūrėti</span></div>
        </div>
        <div class="kbd k">Ctrl + A</div>

      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>

    <div class="brand-bar">
