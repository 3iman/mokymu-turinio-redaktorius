<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K27 — „Dubliuojate puslapį“ (ep_700_04_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 45% 35%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.tvs-cke-body { min-height: 220px; } .kbd { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 40; padding: 14px 28px; border: 2px solid #333; border-radius: 8px; background: #fff; font: 700 26px var(--tvs-font); box-shadow: 0 4px 0 #333; opacity: 0; }
  .pt { background: #fff; padding: 12px; } .pa { opacity: 0; } .tvs-select { position: relative; } .c-v { position: absolute; left: 18px; color: var(--tvs-text); } .dd-wrap { position: relative; height: 0; z-index: 5; } .cat-dd { position: absolute; left: 0; top: -2px; width: 100%; }
  .dd2 { position: absolute; left: 146px; top: 70px; width: 380px; z-index: 10; } .word { position: absolute; left: 80px; top: 120px; width: 620px; z-index: 6; background: #fff; border: 1px solid #c9c9c9; box-shadow: 0 16px 40px rgba(0,0,0,.2); }
  .word-h { height: 40px; background: #2b579a; color: #fff; display: flex; align-items: center; padding: 0 14px; font: 15px Arial; } .word-b { padding: 24px 28px; font: 20px/1.6 Calibri, Arial; } .sel { background: #b3d4fc; }
  .w-red { color: #d00; font-family: 'Comic Sans MS', cursive; } .w-big { font-size: 26px; font-family: Georgia; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(1341.6px, 250.0px); }
  .pa { opacity: 1; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class="is-on"></i><i class="is-bars"></i><i class=""></i><i class=""></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Puslapiai</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Puslapiai</div>
<div class="tvs-tree pt" data-t="tree"><div class="tvs-node"><div class="tvs-node-handle"></div>Apie mokyklą</div>
            <div class="tvs-node" data-t="pr"><div class="tvs-node-handle"></div><span data-t="prn">Priėmimas į mokyklą</span><div class="tvs-node-acts pa"><span class="tvs-btn is-tiny" data-t="dup">Dubliuoti</span><span class="tvs-btn is-tiny is-info"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>Peržiūrėti</span><span class="tvs-btn is-tiny is-pink"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Ištrinti</span></div></div>
            <div class="tvs-node is-new cp" data-t="cp"><div class="tvs-node-handle"></div>Priėmimas į mokyklą</div><div class="tvs-node"><div class="tvs-node-handle"></div>Mokiniams</div></div>
        </div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
