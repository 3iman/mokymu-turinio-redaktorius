<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .subtitle {
    font-size: 22px;
    font-weight: 400;
    color: var(--c-text-muted);
    text-align: center;
    margin-top: -32px;
    margin-bottom: 64px;
    hyphens: auto;
    overflow-wrap: break-word;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---- Three big question marks row ---- */
  .questions {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 60px;
    margin: 40px auto 56px auto;
    max-width: 1280px;
  }

  .q-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }

  /* Big "?" mark, gradient text color per theme */
  .q-mark {
    font-family: 'Inter', sans-serif;
    font-size: 320px;
    font-weight: 800;
    line-height: 0.85;
    letter-spacing: -8px;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    position: relative;
    user-select: none;
  }

  .q-block.theme-blue .q-mark {
    background-image: linear-gradient(160deg, var(--c-blue-gradient-from) 0%, var(--c-blue-gradient-to) 100%);
  }

  .q-block.theme-green .q-mark {
    background-image: linear-gradient(160deg, var(--c-green-gradient-from) 0%, var(--c-green-gradient-to) 100%);
  }

  .q-block.theme-purple .q-mark {
    background-image: linear-gradient(160deg, var(--c-purple-gradient-from) 0%, var(--c-purple-gradient-to) 100%);
  }

  /* Thematic icon — overlaid as a small badge inside the "?" */
  .q-icon {
    position: absolute;
    top: 88px;
    left: 50%;
    transform: translateX(-50%);
    width: 84px;
    height: 84px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18), 0 0 0 6px var(--c-bg);
  }

  .q-block.theme-blue .q-icon {
    background: var(--c-surface);
    color: var(--c-blue-text-vivid);
    border: 2px solid var(--c-blue-border);
  }

  .q-block.theme-green .q-icon {
    background: var(--c-surface);
    color: var(--c-green-text-vivid);
    border: 2px solid var(--c-green-border);
  }

  .q-block.theme-purple .q-icon {
    background: var(--c-surface);
    color: var(--c-purple-text-vivid);
    border: 2px solid var(--c-purple-border);
  }

  .q-icon svg {
    width: 44px;
    height: 44px;
  }

  /* Label below the question mark */
  .q-label {
    margin-top: 18px;
    font-size: 24px;
    font-weight: 700;
    color: var(--c-text);
    letter-spacing: -0.3px;
    line-height: 1.2;
  }

  .q-tagline {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    margin-top: 6px;
  }

  .q-block.theme-blue .q-tagline { color: var(--c-blue-text-vivid); }
  .q-block.theme-green .q-tagline { color: var(--c-green-text-vivid); }
  .q-block.theme-purple .q-tagline { color: var(--c-purple-text-vivid); }

  /* ---- Bottom hint ---- */
  .hint {
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    color: var(--c-text-muted);
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Klausimai, kurie gali kilti</div>
    <div class="subtitle">Tris klausimus jau apgalvojome — atsakymus rasite žemiau</div>

    <div class="questions">

      <!-- Q1: Marketing concern -->
      <div class="q-block theme-blue">
        <div class="q-mark">?</div>
        <div class="q-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l18-5v12L3 14v-3z"/>
            <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
          </svg>
        </div>
        <div class="q-label">Rinkodara</div>
        <div class="q-tagline">Ar reikia sutikimo</div>
      </div>

      <!-- Q2: Data after contract -->
      <div class="q-block theme-green">
        <div class="q-mark">?</div>
        <div class="q-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>
          </svg>
        </div>
        <div class="q-label">Duomenys</div>
        <div class="q-tagline">Po sutarties pabaigos</div>
      </div>

      <!-- Q3: Self-implement -->
      <div class="q-block theme-purple">
        <div class="q-mark">?</div>
        <div class="q-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div class="q-label">Savarankiškumas</div>
        <div class="q-tagline">Savas sprendimas</div>
      </div>

    </div>

    <div class="hint">Atsakymai pateikti pamokos tekste</div>

    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="./assets/cleverphant-juodas.svg" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="./assets/cleverphant-baltas.png" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
