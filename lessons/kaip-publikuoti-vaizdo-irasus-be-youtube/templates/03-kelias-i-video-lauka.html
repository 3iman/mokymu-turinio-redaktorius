<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K4 — „Kelias į video lauką“ (ep_691_03_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 45% 40%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.btns { display: flex; gap: 8px; margin-bottom: 6px; } .upw { position: absolute; left: 330px; top: 140px; width: 1150px; z-index: 10; } .up-sub { padding: 0 22px 8px; } .tvs-frow .tvs-btn { margin-left: 8px; } .tvs-frow .tvs-fmeta { flex: 1; }
  .brw { position: absolute; inset: 0; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid #dfe3ea; } .brw .pl { position: absolute; inset: 60px 0 0; background: #111; display: flex; align-items: center; justify-content: center; } .brw .pl video, .brw .pl .tvs-svid { width: 900px; height: 500px; }
  .mk { border-radius: 3px; padding: 0 2px; } .vb { opacity: 0; } .vrow2 { display: grid; grid-template-columns: 1fr 1.4fr 260px; gap: 18px; align-items: end; padding: 12px 16px; } .vrow2 .tvs-field { padding: 0; } .vrow2 .tvs-svid { height: 120px; } .pv { opacity: 0; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(944.1px, 391.2px); }
  .caret-u { opacity: 1; }
  .vb { opacity: 1; }
  .pv { opacity: 1; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class=""></i><i class="is-bars"></i><i class=""></i><i class="is-on"></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Naujienos</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Naujienų modulis  /  Naujienos  /  Redaguoti</div>
<div class="tvs-tabs"><div class="tvs-tab">Bendri</div><div class="tvs-tab">Turinys</div><div class="tvs-tab">Nuotraukos</div><div class="tvs-tab is-on" data-t="tabv">Video</div><div class="tvs-tab" data-t="tabs">Sintaksė</div></div><div class="tvs-form is-dense"><div class="tvs-rep vb" data-t="vb"><div class="tvs-rep-bar"><span class="tvs-check"></span>Video 1</div><div class="tvs-rep-body vrow2"><div class="tvs-field"><div class="tvs-label">Antraštė</div><div class="tvs-input is-value">Šventės eisena</div></div>
        <div class="tvs-field" data-t="fv"><div class="tvs-label">Video</div><div class="tvs-input"><span class="tvs-typed ty-u" data-ty="u"><span class="w"><span class="l l1">/</span><span class="l l2">f</span><span class="l l3">i</span><span class="l l4">l</span><span class="l l5">e</span><span class="l l6">s</span><span class="l l7">/</span><span class="l l8">n</span><span class="l l9">a</span><span class="l l10">u</span><span class="l l11">j</span><span class="l l12">i</span><span class="l l13">e</span><span class="l l14">n</span><span class="l l15">o</span><span class="l l16">s</span><span class="l l17">/</span><span class="l l18">s</span><span class="l l19">v</span><span class="l l20">e</span><span class="l l21">n</span><span class="l l22">t</span><span class="l l23">e</span><span class="l l24">s</span><span class="l l25">-</span><span class="l l26">e</span><span class="l l27">i</span><span class="l l28">s</span><span class="l l29">e</span><span class="l l30">n</span><span class="l l31">a</span><span class="l l32">.</span><span class="l l33">m</span><span class="l l34">p</span><span class="l l35">4</span></span></span><span class="tvs-caret caret-u"></span></div></div><div class="tvs-svid pv"><span class="tvs-svid-play"></span></div></div></div><div><span class="tvs-btn is-tiny" data-t="addrow"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>Add Row</span></div></div>
          <div class="tvs-form-foot"><span class="tvs-btn is-tiny" data-t="upd"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Atnaujinti</span><span class="tvs-btn is-tiny"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Išsaugoti ir išeiti</span></div>
        </div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="tvs-ripple rp rp2"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
