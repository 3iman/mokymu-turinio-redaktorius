<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* Kadras 4 — „Rezultatas svetainėje“ (ep_692_04_3): naujiena su PDF puslapiais kaip paveikslėliais, apačioje nuoroda
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 50% 50%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.clip { height: 560px; overflow: hidden; } .pages { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 16px; }
  .pg .tvs-xthumb { width: 520px; height: 300px; } .pdfl { display: inline-block; margin: 24px 0; font-size: 21px; color: var(--tvs-site-link); text-decoration: underline; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(1246.0px, 777.0px); }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-sweb">

        <div class="tvs-sweb-h"><div class="tvs-sweb-crest"></div><div class="tvs-sweb-name">Demo mokykla<small>Demo miestas</small></div></div>
        <div class="tvs-sweb-nav"><span>Apie mokyklą</span><span>Mokiniams</span><span>Tėvams</span><span class="is-on">Naujienos</span><span>Kontaktai</span></div>
        <div class="tvs-sweb-b"><div class="tvs-sweb-t">Mokslo metų pradžios tvarkaraštis</div>
<div class="clip"><div class="scroll"><div class="tvs-sweb-p">Skelbiame mokslo metų pradžios tvarkaraštį.</div>
          <div class="pages"><div class="pg"><div class="tvs-xthumb"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="pg"><div class="tvs-xthumb"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="pg"><div class="tvs-xthumb"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
          <div class="pdfl" data-t="pdfl">Parsisiųskite pdf formatu</div></div></div>
        </div>
      </div>
      <div class="spot"></div>

      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
