<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* Kadras 2 — „Atsisiunčiate JPG“ (ep_692_01_2): „PAGE TO JPG“ → „Convert to JPG“ → „Download JPG images“ → ZIP
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 70% 45%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
  .stage > .scr:nth-of-type(1) { opacity: 0; }
  .stage > .scr:nth-of-type(2) { opacity: 1; }
  .cursor-wrap { transform: translate(1376.0px, 817.0px); }
  .savew { opacity: 1; }


  .br { background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid #dfe3ea; box-shadow: 0 24px 60px rgba(30,40,70,.12); }
  .br .tvs-chrome { position: relative; z-index: 2; }.savew { left: 560px; top: 420px; width: 560px; }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 br">
        <div class="tvs-chrome"><svg class="is-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 12H5M11 5l-7 7 7 7"/></svg><svg class="is-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12h15M13 5l7 7-7 7"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 3.5v5h-5" stroke-linejoin="round"/></svg><div class="tvs-omni" data-t="omni"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h1.5v12h-13V10zm2.5 0h5V7.5a2.5 2.5 0 0 0-5 0z"/></svg><span><span class="is-dim">https://</span>pdf-i-jpg.demo</span></div></div>
        <div class="tvs-xsite" style="right:420px"><div class="tvs-xthumb"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="tvs-xside"><div class="tvs-xopt is-on">PAGE TO JPG</div><div class="tvs-xopt">EXTRACT IMAGES</div><span class="tvs-xbtn" data-t="conv" style="text-align:center;margin-top:auto">Convert to JPG</span></div>
      </div>

      <div class="scr scr2 br">
        <div class="tvs-chrome"><svg class="is-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 12H5M11 5l-7 7 7 7"/></svg><svg class="is-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12h15M13 5l7 7-7 7"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 3.5v5h-5" stroke-linejoin="round"/></svg><div class="tvs-omni" data-t="omni2"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h1.5v12h-13V10zm2.5 0h5V7.5a2.5 2.5 0 0 0-5 0z"/></svg><span><span class="is-dim">https://</span>pdf-i-jpg.demo</span></div></div>
        <div class="tvs-xsite"><div class="tvs-xsite-h">PDF puslapiai paversti JPG</div><span class="tvs-xbtn" data-t="dl">Download JPG images</span></div><div class="tvs-os savew" data-t="savew"><div class="tvs-os-h">Išsaugoti kaip</div><div class="tvs-os-b" style="flex-direction:column;gap:12px"><div>Failo vardas: <b>veiklos-planas-jpg.zip</b></div><div style="display:flex;justify-content:flex-end;gap:10px"><span class="tvs-osbtn">Išsaugoti</span></div></div></div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="tvs-ripple rp rp2"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
