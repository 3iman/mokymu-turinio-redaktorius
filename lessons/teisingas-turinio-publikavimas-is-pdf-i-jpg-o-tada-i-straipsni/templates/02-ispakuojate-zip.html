<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* Kadras 3 — „Išpakuojate ZIP“ (ep_692_02_1): dešinys spustelėjimas → „Išskleisti viską…“ → aplankas → „Išskleisti“
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 40% 40%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(1396.0px, 817.0px); }
  .ctx { opacity: 0; }
  .dlg { opacity: 0; }
  .res { opacity: 1; }

.folder { left: 140px; top: 120px; width: 900px; height: 520px; } .ctx { left: 520px; top: 300px; } .dlg { left: 560px; top: 330px; width: 720px; } .res { left: 760px; top: 220px; width: 760px; height: 300px; }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1">
<div class="tvs-os folder" data-t="folder"><div class="tvs-os-h">Atsisiuntimai</div><div class="tvs-os-b"><div class="tvs-fi"><b></b>Dokumentai</div><div class="tvs-fi is-sel" data-t="zip"><b class="is-zip"></b>veiklos-planas-jpg.zip</div></div></div>
        <div class="tvs-ctx ctx" data-t="ctx"><div>Atidaryti</div><div class="is-hl" data-t="ext">Išskleisti viską…</div><hr><div>Kopijuoti</div><div>Pervadinti</div></div>
        <div class="tvs-os dlg" data-t="dlg"><div class="tvs-os-h">Išskleisti suglaudintus (ZIP) aplankus</div><div class="tvs-os-b" style="flex-direction:column;gap:12px"><div>Failai bus išskleisti į šį aplanką:</div><div class="tvs-input is-value" style="height:44px">C:\Demo mokykla\Naujienos</div><div style="display:flex;justify-content:flex-end;gap:10px"><span class="tvs-osbtn" data-t="go">Išskleisti</span><span class="tvs-osbtn is-sec">Atšaukti</span></div></div></div>
        <div class="tvs-os res" data-t="res"><div class="tvs-os-h">Demo mokykla › Naujienos</div><div class="tvs-os-b"><div class="tvs-fi"><b class="is-img"></b>planas-1.jpg</div><div class="tvs-fi"><b class="is-img"></b>planas-2.jpg</div><div class="tvs-fi"><b class="is-img"></b>planas-3.jpg</div></div></div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="tvs-ripple rp rp2"></div>
      <div class="tvs-ripple rp rp3"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
