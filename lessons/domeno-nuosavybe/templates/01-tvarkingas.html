<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  .title { font-size: 44px; margin-bottom: 26px; }
  .stage { position: relative; width: 1680px; height: 780px; margin: 0 auto; }
  .cursor-wrap { position: absolute; width: 44px; height: 56px; z-index: 30; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }

  .cap { position: absolute; left: 0; right: 0; text-align: center; font-size: 27px; color: var(--c-text-muted); }
  .cardbox { position: absolute; background: var(--c-surface); border: 1.5px solid #dfe3ea; border-radius: 20px;
             box-shadow: 0 20px 50px rgba(30,40,70,.10); box-sizing: border-box; }
  .lbl { font-size: 18px; text-transform: uppercase; letter-spacing: .8px; color: var(--c-text-faint); }
  .big { font-size: 34px; font-weight: 700; color: var(--c-text); }
  .mid { font-size: 26px; color: var(--c-text); }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 10px 20px; font-size: 22px; font-weight: 700; }
  .pill.g { background: var(--c-green-bg); border: 1.5px solid var(--c-green-border); color: var(--c-green-text); }
  .pill.r { background: var(--c-red-bg); border: 1.5px solid var(--c-red-border); color: var(--c-red-text); }
  .pill.a { background: var(--c-amber-bg); border: 1.5px solid #fde68a; color: #92400e; }
  .wsec { background: #f6f8fb; border: 1px solid #e3e7ee; border-radius: 10px; padding: 10px 18px; font-family: ui-monospace, Menlo, monospace;
          font-size: 19px; color: var(--c-text-muted); margin: 0 0 14px; }
  .wrow { display: flex; gap: 26px; margin-bottom: 10px; font-size: 22px; }
  .wrow .k { width: 330px; text-align: right; font-weight: 700; color: var(--c-text); }
  .wrow .v { flex: 1; color: var(--c-text); }


</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="stage">
<div class="brw " style="position:absolute; left:120px; top:30px; width:1120px; height:560px; background:#fff; border:1.5px solid #dfe3ea; border-radius:16px; box-shadow:0 20px 50px rgba(30,40,70,.10); overflow:hidden"><div style="height:60px; background:#f1f3f7; display:flex; align-items:center; gap:14px; padding:0 20px; border-bottom:1px solid #e3e7ee"><span style="width:12px;height:12px;border-radius:50%;background:#e06b5e"></span><span style="width:12px;height:12px;border-radius:50%;background:#e8be55"></span><span style="width:12px;height:12px;border-radius:50%;background:#63b86a"></span><div class="urlbar" style="flex:1; height:36px; background:#fff; border:1px solid #dadce0; border-radius:18px; display:flex; align-items:center; padding:0 18px; font-size:19px; color:var(--c-text); font-family:ui-monospace,Menlo,monospace"><span class="mono">{{url}}</span></div></div><div style="position:relative; height:500px"><div style="position:absolute; inset:0; padding:26px 34px; overflow:hidden"><div class="wsec">{{a_s1}}</div><div class="wrow "><div class="k">{{a_k1}}</div><div class="v"><span class="mono">{{a_v1}}</span></div></div><div class="wrow "><div class="k">{{a_k2}}</div><div class="v">{{a_v2}}</div></div><div class="wrow "><div class="k">{{a_k3}}</div><div class="v"><span class="ikurta">{{a_v3}}</span></div></div><div class="wsec">{{a_s2}}</div><div class="wrow tur"><div class="k">{{a_k4}}</div><div class="v" style="font-weight:700; color:var(--c-green-text)">{{a_v4}}</div></div><div class="wrow "><div class="k">{{a_k5}}</div><div class="v">{{a_v5}}</div></div><div class="wrow "><div class="k">{{a_k6}}</div><div class="v">{{a_v6}}</div></div><div class="wsec">{{a_s3}}</div><div class="wrow "><div class="k">{{a_k9}}</div><div class="v">{{a_v9}}</div></div></div></div></div><div class="cardbox ok" style="left:1300px; top:120px; width:320px; height:380px; padding:34px 30px"><span class="pill g">{{okp}}</span><div class="mid" style="margin-top:24px; line-height:1.4; color:var(--c-text-muted)">{{okt}}</div></div><div class="cap cw" style="top:700px">{{cw}}</div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
