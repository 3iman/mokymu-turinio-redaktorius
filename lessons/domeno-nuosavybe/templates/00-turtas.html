<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  .title { font-size: 44px; margin-bottom: 26px; }
  .stage { position: relative; width: 1680px; height: 780px; margin: 0 auto; }
  .cursor-wrap { position: absolute; width: 44px; height: 56px; z-index: 30; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }

  .cap { position: absolute; left: 0; right: 0; text-align: center; font-size: 27px; color: var(--c-text-muted); }
  .cardbox { position: absolute; background: var(--c-surface); border: 1.5px solid #dfe3ea; border-radius: 20px;
             box-shadow: 0 20px 50px rgba(30,40,70,.10); box-sizing: border-box; }
  .lbl { font-size: 18px; text-transform: uppercase; letter-spacing: .8px; color: var(--c-text-faint); }
  .big { font-size: 34px; font-weight: 700; color: var(--c-text); }
  .mid { font-size: 26px; color: var(--c-text); }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 10px 20px; font-size: 22px; font-weight: 700; }
  .pill.g { background: var(--c-green-bg); border: 1.5px solid var(--c-green-border); color: var(--c-green-text); }
  .pill.r { background: var(--c-red-bg); border: 1.5px solid var(--c-red-border); color: var(--c-red-text); }
  .pill.a { background: var(--c-amber-bg); border: 1.5px solid #fde68a; color: #92400e; }
  .wsec { background: #f6f8fb; border: 1px solid #e3e7ee; border-radius: 10px; padding: 10px 18px; font-family: ui-monospace, Menlo, monospace;
          font-size: 19px; color: var(--c-text-muted); margin: 0 0 14px; }
  .wrow { display: flex; gap: 26px; margin-bottom: 10px; font-size: 22px; }
  .wrow .k { width: 330px; text-align: right; font-weight: 700; color: var(--c-text); }
  .wrow .v { flex: 1; color: var(--c-text); }


</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="stage">
<div class="cardbox dom" style="left:590px; top:40px; width:500px; height:150px; display:flex; align-items:center; justify-content:center"><span class="mono" style="font-size:40px; font-weight:700">{{d}}</span></div><div class="cardbox it0" style="left:60px; top:330px; width:360px; height:230px; padding:32px 28px"><div class="big" style="font-size:30px">{{h0}}</div><div class="mid" style="margin-top:14px; color:var(--c-text-muted); line-height:1.35">{{p0}}</div></div><div class="ln l0" style="position:absolute; left:240px; top:190px; width:2px; height:140px; background:#c9d3e0"></div><div class="cardbox it1" style="left:460px; top:330px; width:360px; height:230px; padding:32px 28px"><div class="big" style="font-size:30px">{{h1}}</div><div class="mid" style="margin-top:14px; color:var(--c-text-muted); line-height:1.35">{{p1}}</div></div><div class="ln l1" style="position:absolute; left:640px; top:190px; width:2px; height:140px; background:#c9d3e0"></div><div class="cardbox it2" style="left:860px; top:330px; width:360px; height:230px; padding:32px 28px"><div class="big" style="font-size:30px">{{h2}}</div><div class="mid" style="margin-top:14px; color:var(--c-text-muted); line-height:1.35">{{p2}}</div></div><div class="ln l2" style="position:absolute; left:1040px; top:190px; width:2px; height:140px; background:#c9d3e0"></div><div class="cardbox it3" style="left:1260px; top:330px; width:360px; height:230px; padding:32px 28px"><div class="big" style="font-size:30px">{{h3}}</div><div class="mid" style="margin-top:14px; color:var(--c-text-muted); line-height:1.35">{{p3}}</div></div><div class="ln l3" style="position:absolute; left:1440px; top:190px; width:2px; height:140px; background:#c9d3e0"></div><div class="cap cz" style="top:620px; font-size:30px; color:var(--c-text)">{{cz}}</div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
