<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  .title { font-size: 44px; margin-bottom: 26px; }
  .stage { position: relative; width: 1680px; height: 780px; margin: 0 auto; }
  .cursor-wrap { position: absolute; width: 44px; height: 56px; z-index: 30; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }

  .cap { position: absolute; left: 0; right: 0; text-align: center; font-size: 27px; color: var(--c-text-muted); }
  .cardbox { position: absolute; background: var(--c-surface); border: 1.5px solid #dfe3ea; border-radius: 20px;
             box-shadow: 0 20px 50px rgba(30,40,70,.10); box-sizing: border-box; }
  .lbl { font-size: 18px; text-transform: uppercase; letter-spacing: .8px; color: var(--c-text-faint); }
  .big { font-size: 34px; font-weight: 700; color: var(--c-text); }
  .mid { font-size: 26px; color: var(--c-text); }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 10px 20px; font-size: 22px; font-weight: 700; }
  .pill.g { background: var(--c-green-bg); border: 1.5px solid var(--c-green-border); color: var(--c-green-text); }
  .pill.r { background: var(--c-red-bg); border: 1.5px solid var(--c-red-border); color: var(--c-red-text); }
  .pill.a { background: var(--c-amber-bg); border: 1.5px solid #fde68a; color: #92400e; }
  .wsec { background: #f6f8fb; border: 1px solid #e3e7ee; border-radius: 10px; padding: 10px 18px; font-family: ui-monospace, Menlo, monospace;
          font-size: 19px; color: var(--c-text-muted); margin: 0 0 14px; }
  .wrow { display: flex; gap: 26px; margin-bottom: 10px; font-size: 22px; }
  .wrow .k { width: 330px; text-align: right; font-weight: 700; color: var(--c-text); }
  .wrow .v { flex: 1; color: var(--c-text); }


</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="stage">
<div style="position:absolute; left:60px; right:60px; top:200px; height:6px; background:#e3e8f0; border-radius:3px"></div><div class="yr y0" style="position:absolute; left:60px; top:120px; width:340px; text-align:center"><div class="big">{{y0}}</div><div style="margin:64px 0 0; font-size:24px; color:var(--c-text-muted)">{{t0}}</div></div><div class="dot d0" style="position:absolute; left:224px; top:192px; width:22px; height:22px; border-radius:50%; background:var(--c-blue-solid)"></div><div class="yr y1" style="position:absolute; left:440px; top:120px; width:340px; text-align:center"><div class="big">{{y1}}</div><div style="margin:64px 0 0; font-size:24px; color:var(--c-text-muted)">{{t1}}</div></div><div class="dot d1" style="position:absolute; left:604px; top:192px; width:22px; height:22px; border-radius:50%; background:var(--c-blue-solid)"></div><div class="yr y2" style="position:absolute; left:820px; top:120px; width:340px; text-align:center"><div class="big">{{y2}}</div><div style="margin:64px 0 0; font-size:24px; color:var(--c-text-muted)">{{t2}}</div></div><div class="dot d2" style="position:absolute; left:984px; top:192px; width:22px; height:22px; border-radius:50%; background:var(--c-blue-solid)"></div><div class="yr y3" style="position:absolute; left:1200px; top:120px; width:340px; text-align:center"><div class="big">{{y3}}</div><div style="margin:64px 0 0; font-size:24px; color:var(--c-text-muted)">{{t3}}</div></div><div class="dot d3" style="position:absolute; left:1364px; top:192px; width:22px; height:22px; border-radius:50%; background:var(--c-blue-solid)"></div><div class="cardbox note" style="left:300px; top:430px; width:1080px; height:180px; padding:40px 44px; text-align:center"><div class="big">{{nb}}</div><div class="mid" style="margin-top:16px; color:var(--c-text-muted)">{{nn}}</div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
