<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K4 — „Logotipų išjungimas“ (ep_708_05_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 75% 35%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.clip { height: 640px; overflow: hidden; } .prow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border: 1px solid #eee; } .prow .tvs-logo-c { height: 110px; } .foot { margin-top: 26px; padding: 18px; background: #e4e3e3; color: #666; font: 16px var(--tvs-site-font); }
  .p-table .tvs-th, .p-table .tvs-row { grid-template-columns: 30px 1fr 160px; } .sw-slot { position: relative; height: 42px; } .sw-slot .tvs-switch { position: absolute; left: 0; top: 0; } .sb { opacity: 0; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(1577.0px, 585.5px); }
  .sa0 { opacity: 0; }
  .sb0 { opacity: 1; }
  .sa1 { opacity: 0; }
  .sb1 { opacity: 1; }
  .sa2 { opacity: 0; }
  .sb2 { opacity: 1; }
  .sa3 { opacity: 0; }
  .sb3 { opacity: 1; }
  .sa4 { opacity: 0; }
  .sb4 { opacity: 1; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class="is-on"></i><i class="is-bars"></i><i class=""></i><i class=""></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Partneriai</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Partneriai ir draugai</div>
<div class="tvs-table p-table"><div class="tvs-th"><div class="tvs-check"></div><span>Pavadinimas</span><span data-t="hen">Enabled</span></div><div class="tvs-row"><div class="tvs-check"></div><div>Demo partneris</div><div><div class="sw-slot" data-t="s0"><span class="sa0"><span class="tvs-switch is-yes "><span>Yes</span><span></span></span></span><span class="sb0"><span class="tvs-switch is-no "><span></span><span>No</span></span></span></div></div></div><div class="tvs-row"><div class="tvs-check"></div><div>Savivaldybė</div><div><div class="sw-slot" data-t="s1"><span class="sa1"><span class="tvs-switch is-yes "><span>Yes</span><span></span></span></span><span class="sb1"><span class="tvs-switch is-no "><span></span><span>No</span></span></span></div></div></div><div class="tvs-row"><div class="tvs-check"></div><div>Biblioteka</div><div><div class="sw-slot" data-t="s2"><span class="sa2"><span class="tvs-switch is-yes "><span>Yes</span><span></span></span></span><span class="sb2"><span class="tvs-switch is-no "><span></span><span>No</span></span></span></div></div></div><div class="tvs-row"><div class="tvs-check"></div><div>Sporto centras</div><div><div class="sw-slot" data-t="s3"><span class="sa3"><span class="tvs-switch is-yes "><span>Yes</span><span></span></span></span><span class="sb3"><span class="tvs-switch is-no "><span></span><span>No</span></span></span></div></div></div><div class="tvs-row"><div class="tvs-check"></div><div>Jaunimo centras</div><div><div class="sw-slot" data-t="s4"><span class="sa4"><span class="tvs-switch is-yes "><span>Yes</span><span></span></span></span><span class="sb4"><span class="tvs-switch is-no "><span></span><span>No</span></span></span></div></div></div></div>
        </div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="tvs-ripple rp rp2"></div>
      <div class="tvs-ripple rp rp3"></div>
      <div class="tvs-ripple rp rp4"></div>
      <div class="tvs-ripple rp rp5"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
