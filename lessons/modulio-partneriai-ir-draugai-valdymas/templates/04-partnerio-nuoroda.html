<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K3 — „Partnerio nuoroda“ (ep_708_04_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 40% 45%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.clip { height: 640px; overflow: hidden; } .prow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border: 1px solid #eee; } .prow .tvs-logo-c { height: 110px; } .foot { margin-top: 26px; padding: 18px; background: #e4e3e3; color: #666; font: 16px var(--tvs-site-font); }
  .p-table .tvs-th, .p-table .tvs-row { grid-template-columns: 30px 1fr 160px; } .sw-slot { position: relative; height: 42px; } .sw-slot .tvs-switch { position: absolute; left: 0; top: 0; } .sb { opacity: 0; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(569.7px, 593.9px); }
  .caret-u { opacity: 1; }
  .caret-t { opacity: 1; }
  .saved { opacity: 1; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class="is-on"></i><i class="is-bars"></i><i class=""></i><i class=""></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Partneriai</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Partneriai ir draugai  /  Demo partneris</div>
<div class="tvs-form is-dense">
            <div class="tvs-field"><div class="tvs-label">Pavadinimas</div><div class="tvs-input is-value">Demo partneris</div></div>
            <div class="tvs-field" data-t="fu"><div class="tvs-label">Url</div><div class="tvs-input is-focus"><span class="tvs-typed ty-u" data-ty="u"><span class="w"><span class="l l1">h</span><span class="l l2">t</span><span class="l l3">t</span><span class="l l4">p</span><span class="l l5">s</span><span class="l l6">:</span><span class="l l7">/</span><span class="l l8">/</span><span class="l l9">d</span><span class="l l10">e</span><span class="l l11">m</span><span class="l l12">o</span><span class="l l13">-</span><span class="l l14">p</span><span class="l l15">a</span><span class="l l16">r</span><span class="l l17">t</span><span class="l l18">n</span><span class="l l19">e</span><span class="l l20">r</span><span class="l l21">i</span><span class="l l22">s</span><span class="l l23">.</span><span class="l l24">l</span><span class="l l25">t</span><span class="l l26">/</span></span></span><span class="tvs-caret caret-u"></span></div></div>
            <div class="tvs-field" data-t="ft"><div class="tvs-label">Target</div><div class="tvs-input"><span class="tvs-typed ty-t" data-ty="t"><span class="w"><span class="l l1">_</span><span class="l l2">b</span><span class="l l3">l</span><span class="l l4">a</span><span class="l l5">n</span><span class="l l6">k</span></span></span><span class="tvs-caret caret-t"></span></div></div></div>
          <div class="tvs-alert saved">Įrašas išsaugotas.</div><div class="tvs-form-foot"><span class="tvs-btn is-tiny"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Išsaugoti</span><span class="tvs-btn is-tiny" data-t="save"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Išsaugoti ir išeiti</span></div>
        </div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
