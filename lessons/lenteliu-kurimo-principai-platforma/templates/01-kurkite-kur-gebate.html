<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    <div class="k-title">{{title}}</div>
    <div class="k-flow"><div class="k-node is-1 b-n1"><div class="k-node-i">1</div><div class="k-node-l">{{step1_label}}</div><div class="k-node-d">{{step1_desc}}</div></div><div class="k-link b-l1"><div class="k-link-t">{{arrow_label_1}}</div><div class="k-link-line"></div></div><div class="k-node is-2 b-n2"><div class="k-node-i">2</div><div class="k-node-l">{{step2_label}}</div><div class="k-node-d">{{step2_desc}}</div></div><div class="k-link b-l2"><div class="k-link-t"></div><div class="k-link-line"></div></div><div class="k-node is-3 b-n3"><div class="k-node-i">3</div><div class="k-node-l">{{step3_label}}</div><div class="k-node-d">{{step3_desc}}</div></div></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
