<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    <div class="k-title">{{title}}</div>
    <div class="k-panel" style="--k-fs:31px;max-width:1320px;margin:0 auto;width:100%"><div class="k-list"><div class="k-row is-plain b-full_size"><span class="k-num">1</span><div>{{full_size}}</div></div><div class="k-row is-plain b-safe_zone"><span class="k-num">2</span><div>{{safe_zone}}</div></div><div class="k-row is-plain b-visible_width"><span class="k-num">3</span><div>{{visible_width}}</div></div><div class="k-row is-plain b-side_zones"><span class="k-num">4</span><div>{{side_zones}}</div></div><div class="k-row is-plain b-mobile"><span class="k-num">5</span><div>{{mobile}}</div></div></div></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
