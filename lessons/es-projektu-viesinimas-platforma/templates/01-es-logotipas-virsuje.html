<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    <div class="k-title">{{title}}</div>
    <div class="k-page"><div class="k-page-bar"><i></i><i></i><i></i></div><div class="k-page-b"><div class="k-eu b-eu"><div class="k-eu-f">★★★</div><span>{{eu_banner_text}}</span></div><div class="k-page-t b-pt">{{page_title}}</div><div class="k-page-p b-pi">{{project_intro}}</div><div class="k-page-m b-pp">{{project_period}}</div></div></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
