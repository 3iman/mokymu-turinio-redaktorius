<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .title {
    font-size: 52px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    margin-bottom: 72px;
    letter-spacing: -0.3px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .lane {
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 32px 40px;
    border-radius: 28px;
    margin-bottom: 36px;
  }

  .lane:last-child { margin-bottom: 0; }

  .lane-direct {
    background: var(--c-green-bg);
    border: 1.5px solid var(--c-green-border);
  }

  .lane-html {
    background: var(--c-blue-bg);
    border: 1.5px solid var(--c-blue-border);
  }

  .lane-label {
    font-size: 22px;
    font-weight: 700;
    color: var(--c-text-faint);
    text-transform: uppercase;
    letter-spacing: 0.9px;
    min-width: 150px;
    max-width: 180px;
    flex-shrink: 0;
  }

  .lane-direct .lane-label { color: var(--c-green-solid); }
  .lane-html .lane-label { color: var(--c-blue-solid); }

  /* ---- Source cards (compact) ---- */
  .sources {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 0 0 auto;
  }

  .source-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 22px;
    background: var(--c-surface);
    border: 1.5px solid var(--c-border);
    border-radius: 16px;
    min-width: 300px;
  }

  .source-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .source-icon svg { width: 26px; height: 26px; }

  .word-card .source-icon { background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to)); }
  .excel-card .source-icon { background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to)); }
  .ai-card .source-icon { background: linear-gradient(135deg, var(--c-purple-gradient-from), var(--c-purple-gradient-to)); }

  .source-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }

  .source-label {
    font-size: 22px;
    font-weight: 700;
    color: var(--c-text);
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .source-desc {
    font-size: 15px;
    color: var(--c-text-muted);
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Arrow ---- */
  .arrow-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 140px;
  }

  .arrow-line {
    display: flex;
    align-items: center;
  }

  .arrow-dash {
    flex: 1;
    min-width: 80px;
    max-width: 160px;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      var(--c-line) 0px,
      var(--c-line) 10px,
      transparent 10px,
      transparent 18px
    );
  }

  .arrow-head {
    width: 0;
    height: 0;
    border-top: 11px solid transparent;
    border-bottom: 11px solid transparent;
    border-left: 16px solid var(--c-text-faint);
  }

  .arrow-label {
    font-size: 17px;
    font-weight: 600;
    color: var(--c-text-faint);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-top: 10px;
    text-align: center;
    width: 100%;
  }

  /* ---- HTML intermediate block ---- */
  .html-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 28px;
    background: var(--c-surface);
    border: 2px solid var(--c-blue-border);
    border-radius: 16px;
    min-width: 130px;
    flex-shrink: 0;
  }

  .html-icon {
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--c-blue-solid);
    margin-bottom: 2px;
    letter-spacing: 0.5px;
  }

  .html-desc {
    font-size: 13px;
    color: var(--c-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ---- Target (Turinio redaktorius) ---- */
  .target {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    min-width: 200px;
  }

  .target-icon {
    width: 92px;
    height: 92px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--c-amber-gradient-from), var(--c-amber-gradient-to));
  }

  .target-icon svg { width: 42px; height: 42px; }

  .target-label {
    font-size: 20px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    letter-spacing: 0.1px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* Shared target icon — identical in both lanes */
</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>

    <!-- Lane 1: Word → direct paste -->
    <div class="lane lane-direct">
      <div class="lane-label">{{path_direct_label}}</div>

      <div class="sources">
        <div class="source-card word-card">
          <div class="source-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
              <line x1="8" y1="17" x2="16" y2="17"/>
            </svg>
          </div>
          <div class="source-text">
            <div class="source-label">{{word_label}}</div>
            <div class="source-desc">{{word_desc}}</div>
          </div>
        </div>
      </div>

      <div class="arrow-container">
        <div class="arrow-line">
          <div class="arrow-dash"></div>
          <div class="arrow-head"></div>
        </div>
        <div class="arrow-label">{{arrow_direct}}</div>
      </div>

      <div class="target">
        <div class="target-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="7" y1="13" x2="17" y2="13"/>
            <line x1="7" y1="16" x2="13" y2="16"/>
          </svg>
        </div>
        <div class="target-label">{{target_label}}</div>
      </div>
    </div>

    <!-- Lane 2: Excel + AI → HTML → paste -->
    <div class="lane lane-html">
      <div class="lane-label">{{path_html_label}}</div>

      <div class="sources">
        <div class="source-card excel-card">
          <div class="source-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="3" y1="15" x2="21" y2="15"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
              <line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
          </div>
          <div class="source-text">
            <div class="source-label">{{excel_label}}</div>
            <div class="source-desc">{{excel_desc}}</div>
          </div>
        </div>

        <div class="source-card ai-card">
          <div class="source-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <circle cx="12" cy="12" r="9"/>
              <line x1="12" y1="3" x2="12" y2="6"/>
              <line x1="12" y1="18" x2="12" y2="21"/>
              <line x1="3" y1="12" x2="6" y2="12"/>
              <line x1="18" y1="12" x2="21" y2="12"/>
            </svg>
          </div>
          <div class="source-text">
            <div class="source-label">{{ai_label}}</div>
            <div class="source-desc">{{ai_desc}}</div>
          </div>
        </div>
      </div>

      <div class="arrow-container">
        <div class="arrow-line">
          <div class="arrow-dash"></div>
          <div class="arrow-head"></div>
        </div>
        <div class="arrow-label">{{arrow_convert}}</div>
      </div>

      <div class="html-block">
        <div class="html-icon">{{html_label}}</div>
        <div class="html-desc">{{html_desc}}</div>
      </div>

      <div class="arrow-container">
        <div class="arrow-line">
          <div class="arrow-dash"></div>
          <div class="arrow-head"></div>
        </div>
        <div class="arrow-label">{{arrow_paste}}</div>
      </div>

      <div class="target">
        <div class="target-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="7" y1="13" x2="17" y2="13"/>
            <line x1="7" y1="16" x2="13" y2="16"/>
          </svg>
        </div>
        <div class="target-label">{{target_label}}</div>
      </div>
    </div>

    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
