<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .lead { font-size: 26px; color: var(--c-text-muted); text-align: center; margin: -28px 0 62px;
          hyphens: auto; overflow-wrap: break-word; }
  .foot { font-size: 24px; color: var(--c-text-secondary); text-align: center; margin-top: 150px;
          hyphens: auto; overflow-wrap: break-word; }

  /* ---- Poraštės maketas (piešiamas, ne ekrano nuotrauka) ---- */
  .fm { background: var(--c-surface-alt); border: 1.5px solid var(--c-border);
        border-radius: 24px; padding: 44px 52px 38px; }

  .fm-top { display: flex; align-items: flex-start; gap: 44px; }
  .fm-col { flex: 1; min-width: 0; }
  .fm-sep { width: 1px; align-self: stretch; background: var(--c-border); flex-shrink: 0; }

  .fm-h { font-size: 23px; font-weight: 700; color: var(--c-text-secondary); margin-bottom: 16px;
          hyphens: auto; overflow-wrap: break-word; }
  .fm-p { font-size: 21px; color: var(--c-text-muted); margin-bottom: 20px;
          hyphens: auto; overflow-wrap: break-word; }
  .fm-btn { display: inline-flex; align-items: center; gap: 16px; background: var(--c-line);
            color: var(--c-surface); font-size: 19px; letter-spacing: .8px; padding: 14px 26px;
            border-radius: 6px; }

  .fm-icons { display: flex; gap: 12px; }
  .fm-ico { width: 42px; height: 42px; border-radius: 8px; background: var(--c-line); }

  .fm-rekv { font-size: 20px; line-height: 1.55; color: var(--c-text-muted);
             hyphens: auto; overflow-wrap: break-word; }

  .fm-line { height: 1px; background: var(--c-border); margin: 36px 0 30px; }

  .fm-bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 32px; }
  .fm-copy { font-size: 19px; line-height: 1.5; color: var(--c-text-faint);
             hyphens: auto; overflow-wrap: break-word; }
  .fm-links { display: flex; align-items: center; gap: 30px; }
  .fm-link { font-size: 21px; color: var(--c-text-muted); white-space: nowrap; }

  .fm-target-wrap { position: relative; }
  .fm-target { display: block; font-size: 21px; color: var(--c-text); white-space: nowrap;
               padding: 12px 20px; border: 4px solid var(--c-red-solid); border-radius: 10px;
               background: var(--c-surface); }
  .fm-arrow { position: absolute; top: calc(100% + 26px); left: 50%; transform: translateX(-50%);
              display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .fm-arrow span { font-size: 26px; font-weight: 700; color: var(--c-red-text-vivid); white-space: nowrap; }

  .fm-brand { display: flex; justify-content: flex-end; }
  .fm-brand img { height: 34px; opacity: .55; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="lead">{{lead}}</div>

    <div class="fm">
      <div class="fm-top">
        <div class="fm-col">
          <div class="fm-h">{{f_klaidos_t}}</div>
          <div class="fm-p">{{f_klaidos_d}}</div>
          <div class="fm-btn">{{f_btn}}
            <svg width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h22M18 2l5 5-5 5"/></svg>
          </div>
        </div>
        <div class="fm-sep"></div>
        <div class="fm-col">
          <div class="fm-h">{{f_bendr}}</div>
          <div class="fm-icons">
            <div class="fm-ico"></div><div class="fm-ico"></div><div class="fm-ico"></div>
            <div class="fm-ico"></div><div class="fm-ico"></div>
          </div>
        </div>
        <div class="fm-sep"></div>
        <div class="fm-col">
          <div class="fm-h">{{f_steig_t}}</div>
          <div class="fm-p">{{f_steig_d}}</div>
        </div>
        <div class="fm-sep"></div>
        <div class="fm-col">
          <div class="fm-rekv">{{f_rekv_1}}<br>{{f_rekv_2}}<br>{{f_rekv_3}}<br>{{f_rekv_4}}</div>
        </div>
      </div>

      <div class="fm-line"></div>

      <div class="fm-bottom">
        <div class="fm-copy">{{f_copy}}</div>
        <div class="fm-links">
          <span class="fm-link">{{f_link_1}}</span>
          <span class="fm-target-wrap">
            <span class="fm-target">{{f_link_2}}</span>
            <span class="fm-arrow">
              <svg width="30" height="42" viewBox="0 0 30 42" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="color: var(--c-red-solid)"><path d="M15 40V5M4 15l11-11 11 11"/></svg>
              <span>{{pointer}}</span>
            </span>
          </span>
        </div>
        <div class="fm-brand">
          <img class="brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
        </div>
      </div>
    </div>

    <div class="foot">{{foot}}</div>
  </div>
</body>
</html>
