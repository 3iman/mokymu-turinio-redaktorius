<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K3 — „Laikmačio laukai“ (ep_703_03_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 40% 45%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; } .two .tvs-field + .tvs-field { border-top: 0; } .mini { position: absolute; right: 50px; top: 200px; width: 380px; z-index: 6; } .mini .tvs-count-g div { width: 56px; font-size: 20px; } .clock { position: absolute; right: 120px; top: 260px; z-index: 6; font-size: 80px; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(1246.0px, 777.0px); }
  .clock { opacity: 0; }
  .mini { opacity: 0; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class="is-on"></i><i class="is-bars"></i><i class=""></i><i class=""></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Laikmačiai</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Laikmatis  /  Redaguoti</div>
<div class="tvs-form is-dense">
            <div class="tvs-field" data-t="f1"><div class="tvs-label">Antraštė</div><div class="tvs-input is-value">Iki naujų mokslo metų liko:</div></div><div class="tvs-field" data-t="f2"><div class="tvs-label">Pabaigos data</div><div class="tvs-input is-value">2027-09-01 08:00</div></div>
            <div class="two"><div class="tvs-field" data-t="f3"><div class="tvs-label">Rodyti nuo</div><div class="tvs-input is-value">2027-07-01 00:00</div></div><div class="tvs-field" data-t="f4"><div class="tvs-label">Rodyti iki</div><div class="tvs-input is-value">2027-09-01 10:00</div></div></div><div class="tvs-field" data-t="f5"><div class="tvs-label">Tekstas pasibaigus</div><div class="tvs-input is-value">Sveiki sugrįžę į mokyklą!</div></div></div>
          <div class="tvs-form-foot"><span class="tvs-btn is-tiny"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Atnaujinti</span></div>
        </div>
        <div class="clock">⏰</div><div class="mini"><div class="tvs-count " data-t="mcnt"><div class="tvs-count-h">Iki naujų mokslo metų liko:</div><div class="tvs-count-g"><div>34<small>d.</small></div><div>11<small>val.</small></div><div>27<small>min.</small></div><div>05<small>sek.</small></div></div></div></div>
      </div>
      <div class="spot"></div>

      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
