<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K3 — „Unikalus Slug“ (ep_695_02_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 45% 35%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }

  .n-table .tvs-th, .n-table .tvs-row { grid-template-columns: 30px 1fr 200px 260px 180px; }
  .sw-slot { position: relative; height: 42px; } .sw-slot .tvs-switch { position: absolute; left: 0; top: 0; } .sb { opacity: 0; }
  .tvs-split2 .tvs-form { padding: 0 18px; } .tvs-split2 .tvs-field { padding: 10px 0; }
  .btns { display: flex; gap: 8px; margin-bottom: 6px; }
  .tvs-split2-r .tvs-art-img { height: 200px; } .old { display: inline-block; max-width: 0; overflow: hidden; white-space: nowrap; vertical-align: top; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(420.1px, 601.0px); }
  .caret-sl { opacity: 1; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class=""></i><i class="is-bars"></i><i class=""></i><i class="is-on"></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Naujienos</span><span>Kategorijos</span><span>Nustatymai</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Naujienų modulis  /  Naujienos  /  Redaguoti</div>

          <div class="tvs-tabs"><div class="tvs-tab is-on">Bendri</div><div class="tvs-tab">Turinys</div><div class="tvs-tab">Nuotraukos</div><div class="tvs-tab">Nustatymas</div></div><div class="tvs-form is-dense"><div class="tvs-field"><div class="tvs-label">Pavadinimas<span class="tvs-req">*</span></div><div class="tvs-input is-value">Pirmokų šventė</div></div><div class="tvs-field" data-t="fslug"><div class="tvs-label">Slug<span class="tvs-req">*</span></div><div class="tvs-help">Naudojamas kaip naujienos adresas</div><div class="tvs-input is-focus"><span class="old">pirmoku-svente</span><span class="tvs-typed ty-sl" data-ty="sl"><span class="w"><span class="l l1">p</span><span class="l l2">i</span><span class="l l3">r</span><span class="l l4">m</span><span class="l l5">o</span><span class="l l6">k</span><span class="l l7">u</span><span class="l l8">-</span><span class="l l9">s</span><span class="l l10">v</span><span class="l l11">e</span><span class="l l12">n</span><span class="l l13">t</span><span class="l l14">e</span><span class="l l15">-</span><span class="l l16">2</span><span class="l l17">0</span><span class="l l18">2</span><span class="l l19">6</span></span></span><span class="tvs-caret caret-sl"></span></div></div><div class="tvs-field"><div class="tvs-label">Kategorija</div><div class="tvs-select">Renginiai</div></div></div>
          <div class="tvs-form-foot"><span class="tvs-btn is-tiny" data-t="upd"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Atnaujinti</span><span class="tvs-btn is-tiny"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Išsaugoti ir išeiti</span></div>
        </div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
