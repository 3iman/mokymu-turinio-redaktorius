<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .lead { font-size: 26px; color: var(--c-text-muted); text-align: center; margin: -30px 0 54px; }
  .foot { font-size: 24px; color: var(--c-text-secondary); text-align: center; margin-top: 52px; }

  .doors { display: flex; gap: 26px; align-items: flex-start; justify-content: center; }
  .door { flex: 1; max-width: 260px; position: relative; }
  .door svg { display: block; width: 100%; height: auto; }
  .dlabel { position: absolute; left: 12%; right: 12%; top: 52%; background: #f5f7fa;
            border: 2px solid #c3cad6; border-radius: 8px; padding: 14px 10px; text-align: center;
            font-size: 20px; font-weight: 700; color: var(--c-text); line-height: 1.25;
            hyphens: auto; overflow-wrap: break-word; }

</style>
</head>
<body>
  <div class="card">
    <div class="title">Taip pat pagal Cleverphant standartą</div>
    <div class="doors">
      <div class="door">
        <svg viewBox="0 0 150 230" fill="none">
          <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="4"/>
          <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
          <circle cx="120" cy="140" r="7" fill="#4c5566"/>
        </svg>
        <div class="dlabel">Ugdymas</div>
      </div>
      <div class="door">
        <svg viewBox="0 0 150 230" fill="none">
          <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="4"/>
          <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
          <circle cx="120" cy="140" r="7" fill="#4c5566"/>
        </svg>
        <div class="dlabel">Pagalba mokiniams ir tėvams</div>
      </div>
      <div class="door">
        <svg viewBox="0 0 150 230" fill="none">
          <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="4"/>
          <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
          <circle cx="120" cy="140" r="7" fill="#4c5566"/>
        </svg>
        <div class="dlabel">Neformalusis švietimas</div>
      </div>
      <div class="door">
        <svg viewBox="0 0 150 230" fill="none">
          <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="4"/>
          <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
          <circle cx="120" cy="140" r="7" fill="#4c5566"/>
        </svg>
        <div class="dlabel">Didžiuojamės</div>
      </div>
      <div class="door">
        <svg viewBox="0 0 150 230" fill="none">
          <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="4"/>
          <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
          <circle cx="120" cy="140" r="7" fill="#4c5566"/>
        </svg>
        <div class="dlabel">Renginiai</div>
      </div>
      <div class="door">
        <svg viewBox="0 0 150 230" fill="none">
          <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="4"/>
          <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
          <circle cx="120" cy="140" r="7" fill="#4c5566"/>
        </svg>
        <div class="dlabel">Struktūra ir kontaktai</div>
      </div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="./assets/cleverphant-juodas.svg" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="./assets/cleverphant-baltas.png" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
