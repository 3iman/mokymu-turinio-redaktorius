<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .viewport { position: relative; height: 680px; overflow: hidden; background: var(--c-surface);
              border: 1.5px solid var(--c-border); border-radius: 20px; }
  .page { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px; }
  .ph { height: 54px; background: #3b4250; border-radius: 8px; margin-bottom: 18px; }
  .pbody { display: flex; gap: 18px; margin-bottom: 22px; }
  .pbox { flex: 1; height: 150px; background: var(--c-surface-alt); border-radius: 10px; }
  .hero { height: 230px; }
  .zpath { position: absolute; left: 26px; right: 26px; top: 26px; height: 600px; pointer-events: none; }
  .footer { background: var(--c-surface-alt); border-radius: 12px; padding: 30px 26px; display: flex; gap: 22px; }
  .fcol { flex: 1; border: 3px solid transparent; border-radius: 12px; padding: 18px 20px; margin: -18px -8px; }
  .fh { font-size: 21px; font-weight: 700; color: var(--c-text-secondary); margin-bottom: 14px; }
  .fl { display: block; height: 11px; background: var(--c-border); border-radius: 6px; margin-bottom: 12px; }
  .fcol.on { background: var(--c-surface); border-color: var(--c-blue-solid); }
  .fcol.on .fh { color: var(--c-blue-text-vivid); }
  .fitem { font-size: 19px; color: var(--c-text-muted); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Jie kabo ant informacijos stendo</div>
    <div class="viewport">
      <div class="page">
        <div class="ph"></div>
        <div class="pbody"><div class="pbox hero"></div></div>
        <div class="pbody"><div class="pbox"></div><div class="pbox"></div><div class="pbox"></div></div>
        <div class="pbody"><div class="pbox"></div><div class="pbox"></div><div class="pbox"></div></div>
        <div class="pbody"><div class="pbox" style="height:110px"></div><div class="pbox" style="height:110px"></div></div>
        <div class="footer">
          <div class="fcol"><div class="fh">Gimnazija</div><i class="fl"></i><i class="fl" style="width:78%"></i><i class="fl" style="width:86%"></i><i class="fl" style="width:64%"></i></div>
          <div class="fcol"><div class="fh">Paslaugos</div><i class="fl"></i><i class="fl" style="width:78%"></i><i class="fl" style="width:86%"></i><i class="fl" style="width:64%"></i></div>
          <div class="fcol"><div class="fh">Ataskaitos</div><i class="fl"></i><i class="fl" style="width:78%"></i><i class="fl" style="width:86%"></i><i class="fl" style="width:64%"></i></div>
          <div class="fcol on"><div class="fh">Informacija</div>
            <div class="fitem">Asmens duomenų apsauga</div><div class="fitem">Pranešėjų apsauga</div><div class="fitem">Korupcijos prevencija</div>
            <div class="fitem">Civilinė sauga</div><div class="fitem">Teisinė informacija</div><div class="fitem">Atviri duomenys</div>
          </div>
        </div>
        <svg class="zpath" viewBox="0 0 1628 600" preserveAspectRatio="none" fill="none">
          <path d="M60 60 H1560 L80 420 H1520" stroke="var(--c-blue-solid)" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round" opacity=".6" pathLength="100"/>
        </svg>
      </div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="./assets/cleverphant-juodas.svg" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="./assets/cleverphant-baltas.png" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
