<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .lead { font-size: 26px; color: var(--c-text-muted); text-align: center; margin: -30px 0 54px; }
  .foot { font-size: 24px; color: var(--c-text-secondary); text-align: center; margin-top: 52px; }

  .nav { display: flex; background: var(--c-green-nav); border-radius: 10px; overflow: hidden; }
  .nav .it { flex: 1; padding: 26px 12px; color: #fff; font-size: 18px; font-weight: 700;
             text-transform: uppercase; text-align: center; line-height: 1.25;
             border-right: 1px solid rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; }
  .nav .it:last-child { border-right: 0; }

  .stage { display: flex; flex-direction: column; gap: 30px; }
  .lbl { font-size: 20px; text-transform: uppercase; letter-spacing: .8px; color: var(--c-text-faint); margin-bottom: 12px; }
  .arw { display: flex; justify-content: center; color: var(--c-line); }
  .it.out { background: rgba(255,255,255,.2); color: rgba(255,255,255,.5); }
  .it.in2 { background: var(--c-blue-solid); }
  .moved { margin-top: 26px; display: flex; align-items: center; gap: 18px; justify-content: center;
           font-size: 23px; color: var(--c-blue-text); }
  .moved svg { width: 34px; height: 34px; flex-shrink: 0; }

</style>
</head>
<body>
  <div class="card">
    <div class="title">Taip, jei durų lieka šešerios</div>
    <div class="stage">
      <div>
        <div class="lbl">Buvo</div>
        <div class="nav">
          <div class="it">Ugdymas</div><div class="it">Pagalba mokiniams ir tėvams</div>
          <div class="it out">Neformalusis švietimas</div><div class="it">Didžiuojamės</div>
          <div class="it">Renginiai</div><div class="it">Struktūra ir kontaktai</div>
        </div>
      </div>
      <div class="arw"><svg width="40" height="46" viewBox="0 0 40 46" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 2v40M9 32l11 11 11-11"/></svg></div>
      <div>
        <div class="lbl">Tampa</div>
        <div class="nav">
          <div class="it">Ugdymas</div><div class="it">Pagalba mokiniams ir tėvams</div>
          <div class="it in2">Inžinerinis ugdymas</div><div class="it">Didžiuojamės</div>
          <div class="it">Renginiai</div><div class="it">Struktūra ir kontaktai</div>
        </div>
      </div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="./assets/cleverphant-juodas.svg" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="./assets/cleverphant-baltas.png" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
