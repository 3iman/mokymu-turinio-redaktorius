<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .wrap { display: flex; justify-content: center; padding: 0 140px; }
  .building { width: 100%; max-width: 1260px; position: relative; }
  .roof { height: 0; border-left: 70px solid transparent; border-right: 70px solid transparent;
          border-bottom: 64px solid #4c5566; margin: 0 -40px; }
  .facade { background: #f2f4f8; border: 5px solid #4c5566; border-top: 0; padding: 54px 56px 0;
            display: flex; gap: 30px; align-items: flex-end; }
  .door { flex: 1; position: relative; }
  .door svg { display: block; width: 100%; height: auto; }
  .dlabel { position: absolute; left: 10%; right: 10%; top: 52%; background: #f5f7fa;
            border: 2px solid #c3cad6; border-radius: 7px; padding: 10px 6px; text-align: center;
            font-size: 16px; font-weight: 700; color: var(--c-text); line-height: 1.2;
            hyphens: auto; overflow-wrap: break-word; }
  .ground { height: 5px; background: #4c5566; margin: 0 -60px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="wrap">
      <div class="building">
        <div class="roof"></div>
        <div class="facade">
          <div class="door">
            <svg viewBox="0 0 150 230" fill="none">
              <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="5"/>
              <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
              <circle cx="120" cy="140" r="7" fill="#4c5566"/>
            </svg>
            <div class="dlabel">{{items_1}}</div>
          </div>
          <div class="door">
            <svg viewBox="0 0 150 230" fill="none">
              <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="5"/>
              <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
              <circle cx="120" cy="140" r="7" fill="#4c5566"/>
            </svg>
            <div class="dlabel">{{items_2}}</div>
          </div>
          <div class="door">
            <svg viewBox="0 0 150 230" fill="none">
              <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="5"/>
              <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
              <circle cx="120" cy="140" r="7" fill="#4c5566"/>
            </svg>
            <div class="dlabel">{{items_3}}</div>
          </div>
          <div class="door">
            <svg viewBox="0 0 150 230" fill="none">
              <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="5"/>
              <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
              <circle cx="120" cy="140" r="7" fill="#4c5566"/>
            </svg>
            <div class="dlabel">{{items_4}}</div>
          </div>
          <div class="door">
            <svg viewBox="0 0 150 230" fill="none">
              <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="5"/>
              <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
              <circle cx="120" cy="140" r="7" fill="#4c5566"/>
            </svg>
            <div class="dlabel">{{items_5}}</div>
          </div>
          <div class="door">
            <svg viewBox="0 0 150 230" fill="none">
              <rect x="6" y="6" width="138" height="218" rx="10" fill="var(--c-surface)" stroke="#4c5566" stroke-width="5"/>
              <rect x="22" y="22" width="106" height="88" rx="6" fill="#eef1f6" stroke="#c3cad6" stroke-width="3"/>
              <circle cx="120" cy="140" r="7" fill="#4c5566"/>
            </svg>
            <div class="dlabel">{{items_6}}</div>
          </div>
        </div>
        <div class="ground"></div>
      </div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
