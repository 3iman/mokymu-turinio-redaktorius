<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .lead { font-size: 26px; color: var(--c-text-muted); text-align: center; margin: -30px 0 54px; }
  .foot { font-size: 24px; color: var(--c-text-secondary); text-align: center; margin-top: 52px; }

  .q { font-size: 30px; color: var(--c-text-muted); text-align: center; margin: -30px 0 46px; }
  .cols { display: flex; gap: 56px; align-items: stretch; }
  .left { flex: 1; display: flex; flex-direction: column; gap: 22px; justify-content: center; }
  .head { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
          margin-bottom: 4px; }
  .head.l { color: var(--c-red-text); } .head.r { color: var(--c-green-text-vivid); }
  .ch { border-radius: 18px; padding: 28px 30px; font-size: 26px; }
  .c1 { background: var(--c-surface); border: 1.5px solid var(--c-border); color: var(--c-text); }
  .c2 { background: var(--c-amber-bg); border: 1.5px solid var(--c-amber-border); color: var(--c-text); }
  .c3 { background: var(--c-red-bg); border: 1.5px solid var(--c-red-border); color: var(--c-red-text); }
  .ch small { display: block; font-size: 20px; color: var(--c-text-faint); margin-top: 8px; }
  .right { flex: 1.15; background: var(--c-surface); border: 1.5px solid var(--c-border);
           border-radius: 22px; padding: 30px; }
  .wire-h { height: 46px; background: var(--c-surface-alt); border-radius: 8px; margin-bottom: 18px; }
  .wire-body { display: flex; gap: 18px; }
  .wire-main { flex: 2.4; }
  .wire-title { font-size: 24px; font-weight: 700; color: var(--c-text); margin-bottom: 16px; }
  .eu { background: #fff; border: 1.5px solid var(--c-border); border-radius: 10px; padding: 22px;
        display: flex; align-items: center; gap: 18px; }
  .flag { width: 116px; height: 78px; background: #003399; border-radius: 4px; position: relative; flex-shrink: 0; }
  .flag span { position: absolute; width: 9px; height: 9px; background: var(--c-eu-yellow);
               border-radius: 50%; }
  .eu-t { font-size: 22px; font-weight: 700; color: #003399; line-height: 1.25; }
  .lines { margin-top: 18px; }
  .lines i { display: block; height: 12px; background: var(--c-surface-alt); border-radius: 6px; margin-bottom: 10px; }
  .wire-side { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .ban { height: 54px; background: var(--c-surface-alt); border-radius: 6px; }
  .side-l { font-size: 16px; color: var(--c-text-faint); text-transform: uppercase; letter-spacing: .6px; }
  .real { margin-top: 20px; font-size: 21px; color: var(--c-blue-text); }
  .real b { display: block; font-size: 18px; text-transform: uppercase; letter-spacing: .8px;
            color: var(--c-text-faint); margin-bottom: 6px; }

</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="cols">
      <div class="left">
        <div class="head l">{{left_head}}</div>
        <div class="ch c1">{{chain_1}}</div>
        <div class="ch c2">{{chain_2}}</div>
        <div class="ch c3">{{chain_3}}</div>
      </div>
      <div class="right">
        <div class="head r">{{right_head}}</div>
        <div class="wire-h"></div>
        <div class="wire-body">
          <div class="wire-main">
            <div class="wire-title">{{wire_page}}</div>
            <div class="eu">
              <div class="flag"><span style="left:89.5px; top:30.5px"></span><span style="left:84.1px; top:43.5px"></span><span style="left:69.5px; top:53.0px"></span><span style="left:49.5px; top:56.5px"></span><span style="left:29.5px; top:53.0px"></span><span style="left:14.9px; top:43.5px"></span><span style="left:9.5px; top:30.5px"></span><span style="left:14.9px; top:17.5px"></span><span style="left:29.5px; top:8.0px"></span><span style="left:49.5px; top:4.5px"></span><span style="left:69.5px; top:8.0px"></span><span style="left:84.1px; top:17.5px"></span></div>
              <div class="eu-t">{{wire_eu}}</div>
            </div>
            <div class="lines"><i></i><i style="width:82%"></i><i style="width:64%"></i></div>
          </div>
          <div class="wire-side">
            <div class="side-l">{{wire_side}}</div>
            <div class="ban"></div><div class="ban"></div><div class="ban"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
