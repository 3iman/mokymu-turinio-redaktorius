<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .lead { font-size: 26px; color: var(--c-text-muted); text-align: center; margin: -30px 0 54px; }
  .foot { font-size: 24px; color: var(--c-text-secondary); text-align: center; margin-top: 52px; }

  .nav2 { display: flex; flex-wrap: wrap; background: var(--c-green-nav); border-radius: 10px; overflow: hidden; }
  .nav2 .it { flex: 1 1 auto; padding: 26px 20px; color: #fff; font-size: 20px; font-weight: 700;
              text-transform: uppercase; text-align: center; line-height: 1.25;
              border-right: 1px solid rgba(255,255,255,.3); border-bottom: 1px solid rgba(255,255,255,.3);
              display: flex; align-items: center; justify-content: center; }
  .q { margin: 54px auto 0; max-width: 760px; border: 3px dashed var(--c-text-faint); border-radius: 22px;
       padding: 34px; text-align: center; font-size: 34px; font-weight: 700; color: var(--c-text-faint); }

</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="nav2">
      <div class="it">{{items_1}}</div><div class="it">{{items_2}}</div><div class="it">{{items_3}}</div>
      <div class="it">{{items_4}}</div><div class="it">{{items_5}}</div><div class="it">{{items_6}}</div>
      <div class="it">{{items_7}}</div><div class="it">{{items_8}}</div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
