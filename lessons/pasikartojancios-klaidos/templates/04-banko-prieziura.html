<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    <div class="k-title">{{title}}</div>
    <div class="k-zs"><div class="k-z b-z1"><div class="k-num">{{step1_num}}</div><div><div class="k-z-l">{{step1_label}}</div><div class="k-z-d">{{step1_desc}}</div></div></div><div class="k-z b-z2"><div class="k-num">{{step2_num}}</div><div><div class="k-z-l">{{step2_label}}</div><div class="k-z-d">{{step2_desc}}</div></div></div><div class="k-z b-z3"><div class="k-num">{{step3_num}}</div><div><div class="k-z-l">{{step3_label}}</div><div class="k-z-d">{{step3_desc}}</div></div></div></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
