<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    <div class="k-title is-small">{{title}}</div>
    <div class="k-tl" style="--k-n:8"><div class="k-tl-s b-t0"><div class="k-tl-l"><span class="k-tl-n">1</span>{{step1_label}}</div><div class="k-tl-d"></div></div><div class="k-tl-s b-t1"><div class="k-tl-l"><span class="k-tl-n">2</span>{{step2_label}}</div><div class="k-tl-d"></div></div><div class="k-tl-s b-t2"><div class="k-tl-l"><span class="k-tl-n">3</span>{{step3_label}}</div><div class="k-tl-d"></div></div><div class="k-tl-s b-t3"><div class="k-tl-l"><span class="k-tl-n">4</span>{{step4_label}}</div><div class="k-tl-d"></div></div><div class="k-tl-s b-t4"><div class="k-tl-l"><span class="k-tl-n">5</span>{{step5_label}}</div><div class="k-tl-d"></div></div><div class="k-tl-s b-t5"><div class="k-tl-l"><span class="k-tl-n">6</span>{{step6_label}}</div><div class="k-tl-d"></div></div><div class="k-tl-s b-t6"><div class="k-tl-l"><span class="k-tl-n">7</span>{{step7_label}}</div><div class="k-tl-d"></div></div><div class="k-tl-s b-t7"><div class="k-tl-l"><span class="k-tl-n">8</span>{{step8_label}}</div><div class="k-tl-d"></div></div></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
