<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="file:///Users/eimantasgardauskas/Documents/AI vizualai/illustrations/tokens/tokens.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  width: 1920px;
  height: 1080px;
  background-image: url('/Users/eimantasgardauskas/Documents/AI vizualai/illustrations/assets/blue_bg.png');
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 48px;
  position: relative;
}

.title {
  font-size: 72px;
  font-weight: 800;
  color: #ffffff;
  text-align: center;
  max-width: 1400px;
  line-height: 1.2;
  letter-spacing: -1px;
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
}

.accent-line {
  width: 100px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.45);
}

.subtitle {
  font-size: 28px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.75);
  text-align: center;
  letter-spacing: 0.5px;
}

.url {
  font-size: 20px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.5);
  text-align: center;
  letter-spacing: 1px;
  position: absolute;
  bottom: 48px;
}
</style>
</head>
<body>
  <div class="card">
    <div class="title">Lentelių redagavimas WYSIWYG redaktoriuje</div>
    <div class="accent-line"></div>
    <div class="subtitle">250+ mokyklų jau naudoja Cleverphant</div>
    <div class="url">www.cleverphant.lt</div>
  </div>
</body>
</html>
