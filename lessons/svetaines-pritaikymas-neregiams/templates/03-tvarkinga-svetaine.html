<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    <div class="k-title">{{title}}</div>
    <div class="k-panel" style="--k-fs:31px;max-width:1320px;margin:0 auto;width:100%"><div class="k-list"><div class="k-row b-item_1"><span class="k-num">1</span><div class="k-pair"><b>{{item_1_a}}</b><i>→</i><span>{{item_1_b}}</span></div></div><div class="k-row b-item_2"><span class="k-num">2</span><div class="k-pair"><b>{{item_2_a}}</b><i>→</i><span>{{item_2_b}}</span></div></div><div class="k-row b-item_3"><span class="k-num">3</span><div class="k-pair"><b>{{item_3_a}}</b><i>→</i><span>{{item_3_b}}</span></div></div><div class="k-row b-item_4"><span class="k-num">4</span><div class="k-pair"><b>{{item_4_a}}</b><i>→</i><span>{{item_4_b}}</span></div></div></div></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
