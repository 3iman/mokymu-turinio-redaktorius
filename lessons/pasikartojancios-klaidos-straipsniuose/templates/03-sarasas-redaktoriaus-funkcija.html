<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K4 — „Sąrašas redaktoriaus funkcija“ (ep_694_03_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 30% 35%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.tvs-cke-body { min-height: 300px; font-size: 20px; } .lst { position: relative; } .star, .ul { line-height: 1.7; } .ul { position: absolute; left: 0; top: 0; margin: 0; padding-left: 26px; } .sel { padding: 0 2px; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(405.0px, 283.0px); }
  .star { opacity: 0; }
  .ul { opacity: 1; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class=""></i><i class="is-bars"></i><i class=""></i><i class="is-on"></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Naujienos</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Naujienų modulis  /  Naujienos  /  Redaguoti</div>
<div class="tvs-form" style="padding:10px 0"><div class="tvs-field cke-field"><div class="tvs-label">Turinys</div><div class="tvs-cke" data-t="cke"><div class="tvs-cke-top">
            <div class="tvs-cke-row"><div class="tvs-cke-g"><span class="tvs-cke-b is-label"><i class="tvs-cke-i is-source"></i>Source</span></div>
              <div class="tvs-cke-g"><span class="tvs-cke-b is-off"><i class="tvs-cke-i is-cut"></i></span><span class="tvs-cke-b is-off"><i class="tvs-cke-i is-copy"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-paste"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-pastetext"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-pasteword"></i></span><span class="tvs-cke-sep"></span><span class="tvs-cke-b is-off"><i class="tvs-cke-i is-undo"></i></span><span class="tvs-cke-b is-off"><i class="tvs-cke-i is-redo"></i></span></div>
              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-replace"></i></span><span class="tvs-cke-sep"></span><span class="tvs-cke-b"><i class="tvs-cke-i is-selectall"></i></span></div>
              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-bold"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-italic"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-underline"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-strike"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-subscript"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-superscript"></i></span><span class="tvs-cke-sep"></span><span class="tvs-cke-b"><i class="tvs-cke-i is-copyformatting"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-removeformat"></i></span></div></div>
            <div class="tvs-cke-row"><div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-numberedlist"></i></span><span class="tvs-cke-b ck-bulletedlist" data-t="bul"><i class="tvs-cke-i is-bulletedlist"></i></span><span class="tvs-cke-sep"></span><span class="tvs-cke-b is-off"><i class="tvs-cke-i is-outdent"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-indent"></i></span><span class="tvs-cke-sep"></span><span class="tvs-cke-b"><i class="tvs-cke-i is-blockquote"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-creatediv"></i></span><span class="tvs-cke-sep"></span><span class="tvs-cke-b is-on"><i class="tvs-cke-i is-justifyleft"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-justifycenter"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-justifyright"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-justifyblock"></i></span></div>
              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-link"></i></span><span class="tvs-cke-b is-off"><i class="tvs-cke-i is-unlink"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-anchor"></i></span></div>
              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-table"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-horizontalrule"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-specialchar"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-pagebreak"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-iframe"></i></span></div></div>
            <div class="tvs-cke-row"><span class="tvs-cke-combo">Styles</span><span class="tvs-cke-combo">Normal</span><span class="tvs-cke-combo">Font</span><span class="tvs-cke-combo is-short">Size</span><div class="tvs-cke-g"><span class="tvs-cke-b is-arrow"><i class="tvs-cke-i is-textcolor"></i></span><span class="tvs-cke-b is-arrow"><i class="tvs-cke-i is-bgcolor"></i></span></div>
              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-maximize"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-showblocks"></i></span></div>
              <div class="tvs-cke-g"><span class="tvs-cke-b"><i class="tvs-cke-i is-casechange"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-lowercase"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-uppercase"></i></span><span class="tvs-cke-b"><i class="tvs-cke-i is-capitalize"></i></span></div></div>
          </div><div class="tvs-cke-body"><p>Rugsėjo renginiai:</p><div class="lst" data-t="lst"><div class="star sel"><div>* Šventė</div><div>* Tėvų susirinkimas</div><div>* Ekskursija</div></div><ul class="ul"><li>Šventė</li><li>Tėvų susirinkimas</li><li>Ekskursija</li></ul></div></div><div class="tvs-cke-bot"><span>body</span><span>p</span></div></div></div></div>
        </div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
