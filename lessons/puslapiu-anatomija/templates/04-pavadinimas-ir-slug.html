<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K5 — „Pavadinimas ir Slug“ (ep_701_04_1)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 45% 35%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.pt { background: #fff; padding: 12px; } .tm { position: absolute; left: 560px; top: 230px; width: 560px; z-index: 10; } .pa { opacity: 0; } .btns { display: flex; gap: 8px; }
  .upw { position: absolute; left: 330px; top: 140px; width: 1150px; z-index: 10; } .up-sub { padding: 0 22px 8px; } .drop { position: absolute; z-index: 30; display: flex; gap: 8px; left: 760px; top: 30px; } .drop span { background: #fff; border: 1px solid #ccc; padding: 8px 12px; border-radius: 6px; box-shadow: 0 6px 16px rgba(0,0,0,.2); font-size: 16px; }
  .sw-slot { position: relative; height: 42px; } .sw-slot .tvs-switch { position: absolute; left: 0; top: 0; } .sb { opacity: 0; } .tvs-cke-body { min-height: 200px; } .pre { color: var(--tvs-text-muted); } .add2 { display: inline-block; max-width: 0; overflow: hidden; white-space: nowrap; vertical-align: top; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(737.8px, 223.4px); }
  .caret-p { opacity: 1; }
  .caret-s { opacity: 1; }
  .caret-p2 { opacity: 1; }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class="is-on"></i><i class="is-bars"></i><i class=""></i><i class=""></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Puslapiai</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Puslapiai  /  Pridėti</div>
<div class="tvs-form is-dense"><div class="tvs-field" data-t="fp"><div class="tvs-label">Pavadinimas<span class="tvs-req">*</span></div><div class="tvs-input is-focus"><span class="tvs-typed ty-p" data-ty="p"><span class="w"><span class="l l1">L</span><span class="l l2">o</span><span class="l l3">g</span><span class="l l4">o</span><span class="l l5">p</span><span class="l l6">e</span><span class="l l7">d</span><span class="l l8">a</span><span class="l l9">s</span></span></span><span class="tvs-caret caret-p"></span><span class="tvs-typed ty-p2" data-ty="p2"><span class="l l1">&nbsp;</span><span class="w"><span class="l l2">i</span><span class="l l3">r</span></span><span class="l l4">&nbsp;</span><span class="w"><span class="l l5">s</span><span class="l l6">p</span><span class="l l7">e</span><span class="l l8">c</span><span class="l l9">i</span><span class="l l10">a</span><span class="l l11">l</span><span class="l l12">u</span><span class="l l13">s</span><span class="l l14">i</span><span class="l l15">s</span></span><span class="l l16">&nbsp;</span><span class="w"><span class="l l17">p</span><span class="l l18">e</span><span class="l l19">d</span><span class="l l20">a</span><span class="l l21">g</span><span class="l l22">o</span><span class="l l23">g</span><span class="l l24">a</span><span class="l l25">s</span></span></span></div></div><div class="tvs-field" data-t="fs"><div class="tvs-label">Slug<span class="tvs-req">*</span></div><div class="tvs-input is-value"><span class="tvs-typed ty-s" data-ty="s"><span class="w"><span class="l l1">l</span><span class="l l2">o</span><span class="l l3">g</span><span class="l l4">o</span><span class="l l5">p</span><span class="l l6">e</span><span class="l l7">d</span><span class="l l8">a</span><span class="l l9">s</span></span></span></div></div></div>
          <div class="tvs-form-foot"><span class="tvs-btn is-tiny" data-t="save"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Išsaugoti</span><span class="tvs-btn is-tiny" data-t="save2"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Išsaugoti ir išeiti</span></div>
        </div>
      </div>
      <div class="spot"></div>

      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
