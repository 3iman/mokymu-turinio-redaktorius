<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* K2 — „Tempiate medyje“ (ep_701_01_2)
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 40% 35%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }
.pt { background: #fff; padding: 12px; } .tm { position: absolute; left: 560px; top: 230px; width: 560px; z-index: 10; } .pa { opacity: 0; } .btns { display: flex; gap: 8px; }
  .upw { position: absolute; left: 330px; top: 140px; width: 1150px; z-index: 10; } .up-sub { padding: 0 22px 8px; } .drop { position: absolute; z-index: 30; display: flex; gap: 8px; left: 760px; top: 30px; } .drop span { background: #fff; border: 1px solid #ccc; padding: 8px 12px; border-radius: 6px; box-shadow: 0 6px 16px rgba(0,0,0,.2); font-size: 16px; }
  .sw-slot { position: relative; height: 42px; } .sw-slot .tvs-switch { position: absolute; left: 0; top: 0; } .sb { opacity: 0; } .tvs-cke-body { min-height: 200px; } .pre { color: var(--tvs-text-muted); }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(369.0px, 389.0px); }

</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder" data-t="search">Type to search...</div></div>
        <div class="tvs-side"><i class=""></i><i class="is-on"></i><i class="is-bars"></i><i class=""></i><i class=""></i><i class=""></i></div>
        <div class="tvs-subnav"><span class="is-on">Puslapiai</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">Puslapiai</div>
<div><span class="tvs-btn " data-t="addp"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>Pridėti puslapį</span></div><div class="tvs-tree pt" data-t="tree">
            <div class="tvs-node  " data-t="p0"><div class="tvs-node-handle" data-t="p0h"></div><span data-t="p0n">Apie mokyklą</span><span class="tvs-tag">Default</span></div><div class="tvs-node  " data-t="p1"><div class="tvs-node-handle" data-t="p1h"></div><span data-t="p1n">Veiklos sritys</span><span class="tvs-tag">Default</span></div><div class="tvs-node  " data-t="p2"><div class="tvs-node-handle" data-t="p2h"></div><span data-t="p2n">Paslaugos</span><span class="tvs-tag">Default</span></div><div class="tvs-node  " data-t="p3"><div class="tvs-node-handle" data-t="p3h"></div><span data-t="p3n">Mokiniams</span><span class="tvs-tag">Default</span></div><div class="tvs-node  mv" data-t="p4"><div class="tvs-node-handle" data-t="p4h"></div><span data-t="p4n">Logopedas</span><span class="tvs-tag">Default</span></div></div>
        </div>
      </div>
      <div class="spot"></div>
      <div class="tvs-ripple rp rp1"></div>
      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
