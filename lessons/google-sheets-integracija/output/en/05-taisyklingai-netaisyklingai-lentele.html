<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./tokens/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--c-bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    width: 900px;
    background: var(--c-surface);
    border-radius: 20px;
    padding: 48px 56px;
    box-shadow: var(--c-shadow-card);
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    margin-bottom: 40px;
    letter-spacing: -0.3px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Two columns ---- */
  .columns {
    display: flex;
    gap: 24px;
  }

  .column {
    flex: 1;
    border-radius: 12px;
    padding: 24px;
  }

  .col-do {
    background: var(--c-green-bg);
    border: 1.5px solid var(--c-green-border);
  }

  .col-dont {
    background: var(--c-red-bg);
    border: 1.5px solid var(--c-red-border);
  }

  .col-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  .col-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .col-do .col-icon {
    background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to));
  }

  .col-dont .col-icon {
    background: linear-gradient(135deg, var(--c-red-gradient-from), var(--c-red-gradient-to));
  }

  .col-icon svg {
    width: 16px;
    height: 16px;
  }

  .col-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--c-text);
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .rules-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .rule-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--c-text);
    line-height: 1.5;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .rule-bullet {
    flex-shrink: 0;
    margin-top: 2px;
    font-size: 14px;
  }

  .col-do .rule-bullet { color: var(--c-green-solid); }
  .col-dont .rule-bullet { color: var(--c-red-solid); }

  /* ---- Brand bar ---- */
  .brand-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--c-border-soft);
  }

  .brand-logo-dark { display: none; }

  @media (prefers-color-scheme: dark) {
    .brand-logo-light { display: none; }
    .brand-logo-dark { display: block; }
  }

  .brand-logo {
    height: 22px;
    width: auto;
    opacity: var(--c-brand-logo-opacity);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Table Editing Rules</div>

    <div class="columns">
      <!-- Do's column -->
      <div class="column col-do">
        <div class="col-header">
          <div class="col-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="col-title">Correct</div>
        </div>
        <div class="rules-list">
          <div class="rule-item"><span class="rule-bullet">✓</span> One cell = one row</div>
          <div class="rule-item"><span class="rule-bullet">✓</span> Plain text in cells</div>
          <div class="rule-item"><span class="rule-bullet">✓</span> Column A = minimal formatting</div>
          <div class="rule-item"><span class="rule-bullet">✓</span> Fixed number of columns</div>
        </div>
      </div>

      <!-- Don'ts column -->
      <div class="column col-dont">
        <div class="col-header">
          <div class="col-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
          <div class="col-title">Incorrect</div>
        </div>
        <div class="rules-list">
          <div class="rule-item"><span class="rule-bullet">✗</span> Shift+Enter for multiple lines in a cell</div>
          <div class="rule-item"><span class="rule-bullet">✗</span> Formulas inside cells</div>
          <div class="rule-item"><span class="rule-bullet">✗</span> Column styles and colors</div>
          <div class="rule-item"><span class="rule-bullet">✗</span> Different column count per row</div>
        </div>
      </div>
    </div>

    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="./assets/cleverphant-juodas.svg" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="./assets/cleverphant-baltas.png" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
