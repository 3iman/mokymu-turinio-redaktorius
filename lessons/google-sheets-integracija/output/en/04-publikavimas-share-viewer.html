<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./tokens/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--c-bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    width: 900px;
    background: var(--c-surface);
    border-radius: 20px;
    padding: 48px 56px;
    box-shadow: var(--c-shadow-card);
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    margin-bottom: 40px;
    letter-spacing: -0.3px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Share dialog mockup ---- */
  .dialog {
    max-width: 480px;
    margin: 0 auto 28px;
    border: 1.5px solid var(--c-border);
    border-radius: 12px;
    overflow: hidden;
  }

  .dialog-header {
    background: var(--c-bg);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--c-border);
  }

  .dialog-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--c-text);
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .dialog-close {
    width: 20px;
    height: 20px;
    color: var(--c-text-faint);
  }

  .dialog-body {
    padding: 24px 20px;
  }

  .access-section {
    margin-bottom: 16px;
  }

  .access-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--c-text-faint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .access-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--c-green-bg);
    border: 1.5px solid var(--c-green-solid);
    border-radius: 8px;
    padding: 10px 14px;
  }

  .access-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .access-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .access-icon svg {
    width: 16px;
    height: 16px;
  }

  .access-anyone {
    font-size: 14px;
    font-weight: 600;
    color: var(--c-text);
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .access-role {
    font-size: 13px;
    font-weight: 600;
    color: var(--c-text-muted);
    background: var(--c-surface-alt);
    padding: 4px 12px;
    border-radius: 6px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .dialog-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--c-border);
    display: flex;
    justify-content: flex-end;
  }

  .done-btn {
    background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to));
    color: white;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 24px;
    border-radius: 6px;
    border: none;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Steps annotation ---- */
  .steps-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 24px;
  }

  .step-annotation {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .step-badge {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .step-annotation:nth-child(1) .step-badge { background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to)); }
  .step-annotation:nth-child(2) .step-badge { background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to)); }
  .step-annotation:nth-child(3) .step-badge { background: linear-gradient(135deg, var(--c-purple-gradient-from), var(--c-purple-gradient-to)); }

  .step-text {
    font-size: 13px;
    color: var(--c-text-muted);
    line-height: 1.4;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .step-text strong {
    color: var(--c-text);
    font-weight: 600;
  }

  /* ---- Warning ---- */
  .warning {
    text-align: center;
    font-size: 13px;
    color: var(--c-amber-text-vivid);
    background: var(--c-amber-bg);
    padding: 10px 20px;
    border-radius: 8px;
    max-width: 480px;
    margin: 0 auto;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Brand bar ---- */
  .brand-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--c-border-soft);
  }

  .brand-logo-dark { display: none; }

  @media (prefers-color-scheme: dark) {
    .brand-logo-light { display: none; }
    .brand-logo-dark { display: block; }
  }

  .brand-logo {
    height: 22px;
    width: auto;
    opacity: var(--c-brand-logo-opacity);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">How to Publish the File</div>

    <!-- Share dialog mockup -->
    <div class="dialog">
      <div class="dialog-header">
        <div class="dialog-title">Share</div>
        <svg class="dialog-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div class="dialog-body">
        <div class="access-section">
          <div class="access-label">General access</div>
          <div class="access-row">
            <div class="access-left">
              <div class="access-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              </div>
              <div class="access-anyone">Anyone with the link</div>
            </div>
            <div class="access-role">Viewer</div>
          </div>
        </div>
      </div>
      <div class="dialog-footer">
        <div class="done-btn">Done</div>
      </div>
    </div>

    <!-- Steps -->
    <div class="steps-row">
      <div class="step-annotation">
        <div class="step-badge">1</div>
        <div class="step-text">You click the button <strong>Share</strong></div>
      </div>
      <div class="step-annotation">
        <div class="step-badge">2</div>
        <div class="step-text">In General access you select <strong>Anyone with the link</strong></div>
      </div>
      <div class="step-annotation">
        <div class="step-badge">3</div>
        <div class="step-text">You keep the role as <strong>Viewer</strong></div>
      </div>
    </div>

    <!-- Warning -->
    <div class="warning">If the file is not published, the table won't appear on the website</div>

    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="./assets/cleverphant-juodas.svg" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="./assets/cleverphant-baltas.png" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
