<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>

  .title {
    font-size: 44px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    margin-bottom: 80px;
    letter-spacing: -0.3px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Share dialog mockup ---- */
  .dialog {
    max-width: 1200px;
    margin: 0 auto 80px;
    border: 3px solid var(--c-border);
    border-radius: 24px;
    overflow: hidden;
  }

  .dialog-header {
    background: var(--c-bg);
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--c-border);
  }

  .dialog-title {
    font-size: 34px;
    font-weight: 700;
    color: var(--c-text);
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .dialog-close {
    width: 40px;
    height: 40px;
    color: var(--c-text-faint);
  }

  .dialog-body {
    padding: 48px 40px;
  }

  .access-section {
    margin-bottom: 32px;
  }

  .access-label {
    font-size: 25px;
    font-weight: 600;
    color: var(--c-text-faint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 20px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .access-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--c-green-bg);
    border: 3px solid var(--c-green-solid);
    border-radius: 16px;
    padding: 20px 28px;
  }

  .access-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .access-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .access-icon svg {
    width: 32px;
    height: 32px;
  }

  .access-anyone {
    font-size: 32px;
    font-weight: 600;
    color: var(--c-text);
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .access-role {
    font-size: 30px;
    font-weight: 600;
    color: var(--c-text-muted);
    background: var(--c-surface-alt);
    padding: 8px 24px;
    border-radius: 12px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .dialog-footer {
    padding: 32px 40px 36px;
    border-top: 2px solid var(--c-border);
    display: flex;
    justify-content: flex-end;
  }

  .done-btn {
    background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to));
    color: white;
    font-size: 30px;
    font-weight: 600;
    padding: 18px 56px;
    border-radius: 12px;
    border: none;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Steps annotation ---- */
  .steps-row {
    display: flex;
    justify-content: center;
    gap: 48px;
    margin-bottom: 48px;
  }

  .step-annotation {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .step-badge {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .step-annotation:nth-child(1) .step-badge { background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to)); }
  .step-annotation:nth-child(2) .step-badge { background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to)); }
  .step-annotation:nth-child(3) .step-badge { background: linear-gradient(135deg, var(--c-purple-gradient-from), var(--c-purple-gradient-to)); }

  .step-text {
    font-size: 30px;
    color: var(--c-text-muted);
    line-height: 1.4;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .step-text strong {
    color: var(--c-text);
    font-weight: 600;
  }

  /* ---- Warning ---- */
  .warning {
    text-align: center;
    font-size: 30px;
    color: var(--c-amber-text-vivid);
    background: var(--c-amber-bg);
    padding: 28px 48px;
    border-radius: 16px;
    max-width: 1200px;
    margin: 0 auto;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Brand bar ---- */
</style>
</head>
<body>
  <div class="card">
    <div class="title">Kaip publikuoti failą</div>

    <!-- Share dialog mockup -->
    <div class="dialog">
      <div class="dialog-header">
        <div class="dialog-title">Share</div>
        <svg class="dialog-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div class="dialog-body">
        <div class="access-section">
          <div class="access-label">General access</div>
          <div class="access-row">
            <div class="access-left">
              <div class="access-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              </div>
              <div class="access-anyone">Anyone with the link</div>
            </div>
            <div class="access-role">Editor</div>
          </div>
        </div>
      </div>
      <div class="dialog-footer">
        <div class="done-btn">Done</div>
      </div>
    </div>

    <!-- Steps -->
    <div class="steps-row">
      <div class="step-annotation">
        <div class="step-badge">1</div>
        <div class="step-text">Spaudžiate mygtuką <strong>Share</strong></div>
      </div>
      <div class="step-annotation">
        <div class="step-badge">2</div>
        <div class="step-text">Skiltyje General access pasirenkate <strong>Anyone with the link</strong></div>
      </div>
      <div class="step-annotation">
        <div class="step-badge">3</div>
        <div class="step-text">Paliekate rolę <strong>Editor</strong></div>
      </div>
    </div>

    <!-- Warning -->
    <div class="warning">Jei failas nepublikuotas – lentelė nebus rodoma svetainėje</div>

    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="./assets/cleverphant-juodas.svg" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="./assets/cleverphant-baltas.png" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
