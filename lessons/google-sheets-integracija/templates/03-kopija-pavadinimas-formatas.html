<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>

  .title {
    font-size: 22px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    margin-bottom: 44px;
    letter-spacing: -0.3px;
  }

  /* ---- Steps ---- */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 0;
    max-width: 560px;
    margin: 0 auto;
  }

  .step {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    position: relative;
  }

  /* Vertical connector line */
  .step:not(:last-child) {
    padding-bottom: 32px;
  }

  .step:not(:last-child) .step-num-wrapper::after {
    content: '';
    position: absolute;
    left: 22px;
    top: 46px;
    bottom: 0;
    width: 2px;
    background: repeating-linear-gradient(
      180deg,
      var(--c-line) 0px,
      var(--c-line) 5px,
      transparent 5px,
      transparent 9px
    );
  }

  .step-num-wrapper {
    position: relative;
    flex-shrink: 0;
  }

  .step-num {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: white;
  }

  .step:nth-child(1) .step-num { background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to)); }
  .step:nth-child(2) .step-num { background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to)); }
  .step:nth-child(3) .step-num { background: linear-gradient(135deg, var(--c-purple-gradient-from), var(--c-purple-gradient-to)); }
  .step:nth-child(4) .step-num { background: linear-gradient(135deg, var(--c-amber-gradient-from), var(--c-amber-gradient-to)); }

  .step-content {
    padding-top: 2px;
  }

  .step-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--c-text);
    margin-bottom: 4px;
    line-height: 1.4;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .step-desc {
    font-size: 14px;
    color: var(--c-text-muted);
    line-height: 1.5;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .step-desc .highlight {
    font-weight: 600;
    color: var(--c-text);
    background: var(--c-surface-alt);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    overflow-wrap: break-word;
  }

  .step-desc .format-example {
    display: inline-block;
    margin-top: 6px;
    font-weight: 600;
    color: var(--c-text);
    background: var(--c-amber-bg);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 13px;
    letter-spacing: 0.2px;
  }

  .step-desc .email {
    font-weight: 700;
    color: var(--c-blue-gradient-from);
  }

  .step-note {
    font-size: 12px;
    color: var(--c-text-faint);
    margin-top: 4px;
    font-style: italic;
  }

  /* ---- Brand bar ---- */
</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>

    <div class="steps">
      <!-- Step 1 -->
      <div class="step">
        <div class="step-num-wrapper">
          <div class="step-num">{{step1_num}}</div>
        </div>
        <div class="step-content">
          <div class="step-label">{{step1_label}}</div>
          <div class="step-desc">{{step1_desc}}</div>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step">
        <div class="step-num-wrapper">
          <div class="step-num">{{step2_num}}</div>
        </div>
        <div class="step-content">
          <div class="step-label">{{step2_label}}</div>
          <div class="step-desc">{{step2_desc_prefix}}<span class="highlight">{{step2_desc_code}}</span>{{step2_desc_suffix}}</div>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="step">
        <div class="step-num-wrapper">
          <div class="step-num">{{step3_num}}</div>
        </div>
        <div class="step-content">
          <div class="step-label">{{step3_label}}</div>
          <div class="step-desc">{{step3_desc}}<br><span class="format-example">{{step3_format}}</span></div>
        </div>
      </div>

      <!-- Step 4 -->
      <div class="step">
        <div class="step-num-wrapper">
          <div class="step-num">{{step4_num}}</div>
        </div>
        <div class="step-content">
          <div class="step-label">{{step4_label}}</div>
          <div class="step-desc">{{step4_desc}} <span class="email">{{step4_email}}</span></div>
          <div class="step-note">{{step4_note}}</div>
        </div>
      </div>
    </div>

    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
