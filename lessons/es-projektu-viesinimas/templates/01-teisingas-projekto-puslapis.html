<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>

  .title {
    font-size: 22px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    margin-bottom: 36px;
    letter-spacing: -0.3px;
  }

  /* Browser mockup */
  .mockup {
    border-radius: 10px;
    border: 1px solid var(--c-border);
    overflow: hidden;
    background: var(--c-surface);
  }

  .browser-bar {
    background: var(--c-surface-alt);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--c-border);
  }

  .browser-dots {
    display: flex;
    gap: 5px;
  }

  .browser-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--c-line);
  }

  .browser-url {
    flex: 1;
    background: var(--c-surface);
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 10px;
    color: var(--c-text-faint);
    border: 1px solid var(--c-border);
  }

  /* Site header */
  .site-header {
    background: var(--c-green-nav);
    padding: 6px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .site-nav-item {
    font-size: 8px;
    font-weight: 600;
    color: white;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.9;
  }

  /* Breadcrumb */
  .breadcrumb {
    padding: 8px 20px;
    font-size: 9px;
    color: var(--c-text-faint);
    border-bottom: 1px solid var(--c-border-soft);
  }

  .breadcrumb span {
    color: var(--c-line);
    margin: 0 4px;
  }

  /* Page layout */
  .page-layout {
    display: flex;
    gap: 0;
  }

  .page-main {
    flex: 1;
    padding: 16px 20px 20px;
  }

  .page-sidebar {
    width: 140px;
    background: var(--c-bg);
    padding: 16px 12px;
    border-left: 1px solid var(--c-border-soft);
    flex-shrink: 0;
  }

  /* Page title */
  .page-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--c-text);
    margin-bottom: 14px;
  }

  /* EU banner */
  .eu-banner {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: 4px;
  }

  .eu-flag-img {
    width: 64px;
    height: 44px;
    background: var(--c-accent-solid);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .eu-flag-img svg {
    width: 64px;
    height: 44px;
  }

  .eu-banner-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--c-text);
    line-height: 1.3;
  }

  /* Project text */
  .project-text {
    font-size: 10px;
    color: var(--c-text-secondary);
    line-height: 1.7;
    margin-bottom: 6px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .project-text strong {
    color: var(--c-text);
  }

  /* Sidebar modules */
  .sidebar-module {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    margin-bottom: 4px;
    background: var(--c-surface);
    border-radius: 4px;
    border: 1px solid var(--c-border);
  }

  .sidebar-icon {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background: var(--c-green-nav);
    flex-shrink: 0;
  }

  .sidebar-label {
    font-size: 8px;
    font-weight: 600;
    color: var(--c-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .brand-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--c-border-soft);
  }

  .brand-logo-dark { display: none; }

  @media (prefers-color-scheme: dark) {
    .brand-logo-light { display: none; }
    .brand-logo-dark { display: block; }
  }

  .brand-logo {
    height: 22px;
    width: auto;
    opacity: var(--c-brand-logo-opacity);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>

    <div class="mockup">
      <!-- Browser bar -->
      <div class="browser-bar">
        <div class="browser-dots">
          <span></span><span></span><span></span>
        </div>
        <div class="browser-url">{{browser_url}}</div>
      </div>

      <!-- Site header (green nav bar) -->
      <div class="site-header">
        <div class="site-nav-item">{{nav_1}}</div>
        <div class="site-nav-item">{{nav_2}}</div>
        <div class="site-nav-item">{{nav_3}}</div>
        <div class="site-nav-item">{{nav_4}}</div>
      </div>

      <!-- Breadcrumb -->
      <div class="breadcrumb">
        {{bc_1}}<span>›</span>{{bc_2}}<span>›</span>{{bc_3}}
      </div>

      <!-- Page layout -->
      <div class="page-layout">
        <!-- Main content -->
        <div class="page-main">
          <div class="page-title">{{page_title}}</div>

          <!-- EU banner -->
          <div class="eu-banner">
            <div class="eu-flag-img">
              <svg viewBox="0 0 64 44" width="64" height="44">
                <rect width="64" height="44" rx="2" fill="var(--c-accent-solid)"/>
                <g transform="translate(32,22)" fill="var(--c-eu-yellow)">
                  <circle cx="0" cy="-14" r="1.8"/>
                  <circle cx="7" cy="-12.1" r="1.8"/>
                  <circle cx="12.1" cy="-7" r="1.8"/>
                  <circle cx="14" cy="0" r="1.8"/>
                  <circle cx="12.1" cy="7" r="1.8"/>
                  <circle cx="7" cy="12.1" r="1.8"/>
                  <circle cx="0" cy="14" r="1.8"/>
                  <circle cx="-7" cy="12.1" r="1.8"/>
                  <circle cx="-12.1" cy="7" r="1.8"/>
                  <circle cx="-14" cy="0" r="1.8"/>
                  <circle cx="-12.1" cy="-7" r="1.8"/>
                  <circle cx="-7" cy="-12.1" r="1.8"/>
                </g>
              </svg>
            </div>
            <div class="eu-banner-text">{{eu_banner_text}}</div>
          </div>

          <!-- Project description (real-looking text) -->
          <div class="project-text">
            <strong>{{school_name}}</strong> {{project_intro}}
          </div>
          <div class="project-text">{{project_goal}}</div>
          <div class="project-text">{{project_period}}</div>
          <div class="project-text">{{project_executor}}</div>
          <div class="project-text">{{project_budget}}</div>
        </div>

        <!-- Sidebar -->
        <div class="page-sidebar">
          <div class="sidebar-module">
            <div class="sidebar-icon"></div>
            <div class="sidebar-label">{{sidebar_1}}</div>
          </div>
          <div class="sidebar-module">
            <div class="sidebar-icon"></div>
            <div class="sidebar-label">{{sidebar_2}}</div>
          </div>
          <div class="sidebar-module">
            <div class="sidebar-icon"></div>
            <div class="sidebar-label">{{sidebar_3}}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
