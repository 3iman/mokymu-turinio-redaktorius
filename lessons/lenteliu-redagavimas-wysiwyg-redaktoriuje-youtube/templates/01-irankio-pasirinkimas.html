<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  .title {
    font-size: 44px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    margin-bottom: 14px;
    letter-spacing: -0.5px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .subtitle {
    font-size: 22px;
    font-weight: 400;
    color: var(--c-text-muted);
    text-align: center;
    margin-bottom: 56px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Primary row (2 equal columns) ---- */
  .primary-row {
    display: flex;
    gap: 48px;
    align-items: stretch;
    justify-content: center;
    margin-bottom: 44px;
  }

  .column {
    flex: 1;
    min-width: 0;
    max-width: 640px;
    background: var(--c-surface);
    border: 1.5px solid var(--c-border);
    border-radius: 24px;
    padding: 44px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .column-blue { border-top: 6px solid var(--c-blue-solid); }
  .column-green { border-top: 6px solid var(--c-green-solid); }

  .icon {
    width: 92px;
    height: 92px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    flex-shrink: 0;
  }

  .column-blue .icon {
    background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to));
  }

  .column-green .icon {
    background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to));
  }

  .icon svg {
    width: 44px;
    height: 44px;
  }

  .label {
    font-size: 17px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 14px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .column-blue .label { color: var(--c-blue-text-vivid); }
  .column-green .label { color: var(--c-green-text-vivid); }

  .scenario {
    font-size: 24px;
    font-weight: 600;
    color: var(--c-text);
    line-height: 1.35;
    margin-bottom: 24px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .column-divider {
    width: 56px;
    height: 1px;
    background: var(--c-border);
    margin: 0 0 20px 0;
  }

  .example-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--c-text-faint);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .example {
    font-size: 19px;
    font-weight: 500;
    color: var(--c-text-secondary);
    line-height: 1.4;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  /* ---- Fallback row (smaller, muted, amber) ---- */
  .fallback-row {
    display: flex;
    justify-content: center;
  }

  .fallback-card {
    position: relative;
    max-width: 880px;
    width: 100%;
    background: var(--c-amber-bg);
    border: 1.5px solid var(--c-amber-border);
    border-radius: 18px;
    padding: 22px 32px;
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .fallback-badge {
    position: absolute;
    top: -13px;
    left: 28px;
    background: var(--c-amber-solid);
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    padding: 6px 14px;
    border-radius: 14px;
  }

  .fallback-icon {
    width: 60px;
    height: 60px;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--c-amber-gradient-from), var(--c-amber-gradient-to));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .fallback-icon svg {
    width: 30px;
    height: 30px;
  }

  .fallback-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }

  .fallback-label {
    font-size: 18px;
    font-weight: 700;
    color: var(--c-amber-text-vivid);
    text-transform: uppercase;
    letter-spacing: 1px;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .fallback-scenario {
    font-size: 19px;
    color: var(--c-text-secondary);
    line-height: 1.4;
    hyphens: auto;
    overflow-wrap: break-word;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>

    <!-- Primary options: 2 equal columns -->
    <div class="primary-row">
      <div class="column column-blue">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="7" y1="13" x2="17" y2="13"/>
            <line x1="7" y1="16" x2="13" y2="16"/>
          </svg>
        </div>
        <div class="label">{{col1_label}}</div>
        <div class="scenario">{{col1_scenario}}</div>
        <div class="column-divider"></div>
        <div class="example-label">{{example_label}}</div>
        <div class="example">{{col1_example}}</div>
      </div>

      <div class="column column-green">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
          </svg>
        </div>
        <div class="label">{{col2_label}}</div>
        <div class="scenario">{{col2_scenario}}</div>
        <div class="column-divider"></div>
        <div class="example-label">{{example_label}}</div>
        <div class="example">{{col2_example}}</div>
      </div>
    </div>

    <!-- Fallback option: narrower, muted -->
    <div class="fallback-row">
      <div class="fallback-card">
        <div class="fallback-badge">{{fallback_badge}}</div>
        <div class="fallback-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
            <line x1="9" y1="18" x2="13" y2="18"/>
          </svg>
        </div>
        <div class="fallback-content">
          <div class="fallback-label">{{col3_label}}</div>
          <div class="fallback-scenario">{{col3_scenario}}</div>
        </div>
      </div>
    </div>

    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
