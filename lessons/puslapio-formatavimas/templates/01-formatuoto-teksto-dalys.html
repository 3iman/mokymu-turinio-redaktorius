<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    <div class="k-title is-small">{{title}}</div>
    <div class="k-panel" style="--k-fs:26px;max-width:1680px;margin:0 auto;width:100%"><div class="k-list is-grid"><div class="k-row b-item_1"><span class="k-num">1</span><div>{{item_1}}</div></div><div class="k-row b-item_2"><span class="k-num">2</span><div>{{item_2}}</div></div><div class="k-row b-item_3"><span class="k-num">3</span><div>{{item_3}}</div></div><div class="k-row b-item_4"><span class="k-num">4</span><div>{{item_4}}</div></div><div class="k-row b-item_5"><span class="k-num">5</span><div>{{item_5}}</div></div><div class="k-row b-item_6"><span class="k-num">6</span><div>{{item_6}}</div></div><div class="k-row b-item_7"><span class="k-num">7</span><div>{{item_7}}</div></div></div></div><div class="k-sum b-summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg><span>{{summary}}</span></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
