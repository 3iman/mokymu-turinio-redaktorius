<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* Kadras 8 — „Meniu vardas gali skirtis“: viena forma, kamera priartėja prie „Title“ ir priskirto puslapio eilutės.
     Generuoja sablonai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 0 0; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .caret { opacity: 0; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none;
                 transform: translate(1250px, 780px); }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  .stage { transform-origin: 30% 48%; }
  .blink { opacity: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="stage">

      <div class="scr scr1 tvs-window">
        <div class="tvs-top"><div class="tvs-logo"><i></i></div><div class="tvs-burger"></div><div class="tvs-searchbar is-text is-placeholder">{{search_ph}}</div></div>
        <div class="tvs-side"><i></i><i></i><i class="is-bars is-on"></i><i></i><i></i><i></i></div>
        <div class="tvs-subnav"><span>{{sub_menu}}</span><span class="is-on">{{sub_links}}</span></div>
        <div class="tvs-main">
          <div class="tvs-crumb">{{crumb_edit}}</div>
          <div><span class="tvs-btn is-small"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>{{btn_new_link}}</span></div>
          <div class="tvs-tabs"><div class="tvs-tab is-on">{{tab_main}}</div><div class="tvs-tab">{{tab_opts}}</div></div>
          <div class="tvs-form">
            <div class="tvs-field"><div class="tvs-label">{{f_title}}</div><div class="tvs-help">{{f_title_help}}</div><div class="tvs-input is-value" data-t="titlein"><span class="blink blink1">{{v_title}}</span></div></div>
            <div class="tvs-field"><div class="tvs-label">{{f_page}}<span class="tvs-req">*</span></div><div class="tvs-help">{{f_page_help}}</div><div><span class="tvs-btn is-tiny"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6" stroke-linecap="round"/></svg>{{btn_pick}}</span></div>
              <div class="tvs-picked" data-t="picked"><span class="blink blink2">{{v_page}}</span><span class="tvs-path">{{v_path}}</span><span class="tvs-btn is-tiny is-pink"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><circle cx="12" cy="12" r="8.5"/><path d="M6 18L18 6"/></svg>{{btn_remove}}</span></div></div>
            <div class="tvs-field"><div class="tvs-label">{{f_desc}}</div><div class="tvs-help">{{f_desc_help}}</div><div class="tvs-input is-area"></div></div>
          </div>
          <div class="tvs-form-foot"><span class="tvs-btn is-tiny"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>{{btn_update}}</span><span class="tvs-btn is-tiny"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>{{btn_save_exit}}</span><span class="tvs-sp"></span><span class="tvs-btn is-tiny is-grey-dark">{{btn_cancel}}</span></div>
        </div>
      </div>
      <div class="spot"></div>

      <div class="cursor-wrap"><div class="tvs-cursor"><svg viewBox="0 0 44 56"><path d="M4 3v40l10.5-9.5 7 16 7.5-3.3-7-15.7H36z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
