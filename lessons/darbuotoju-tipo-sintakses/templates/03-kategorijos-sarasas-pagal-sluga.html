<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/tvs.css">
<style>
  /* Kadras 4 — „Kategorijos sąrašas pagal SLUG“ (ep_665_03_1): {{ staff('administracija') }} → visi kategorijos profiliai
     Generuoja epizodai-def.js per epizodai.js — ranka neredaguoti. Bazinė būsena = galutinė (PNG rodo rezultatą). */
  .stage { position: relative; width: 1680px; height: 904px; transform-origin: 50% 50%; }
  .scr { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot { position: absolute; left: 0; top: 0; width: 120px; height: 60px; border: 2.5px solid var(--tvs-info); border-radius: 6px;
          box-shadow: 0 0 0 4000px rgba(0,0,0,.55); opacity: 0; z-index: 60; pointer-events: none; }
  .rp { opacity: 0; z-index: 65; }
  .cursor-wrap { position: absolute; left: 0; top: 0; width: 44px; height: 56px; z-index: 70; pointer-events: none; }
  .cursor-wrap .tvs-cursor { left: 0; top: 0; }
  [class*="caret-"] { opacity: 0; }

  .tvs-split-bot .tvs-cke-body { min-height: 100px; }
  .tvs-split-top .tvs-sweb-b { padding: 14px 40px; }
  .syn { font-family: 'SF Mono', Menlo, monospace; font-size: 17px; padding: 2px 4px; border-radius: 3px; }
  .sp { transform: scale(.8); transform-origin: 0 0; width: 125%; }
  .profs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
  .pc { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; border: 1px solid #e6e6e6; padding: 10px; border-radius: 4px; font-size: 16px; }
  .pc i { height: 80px; border-radius: 3px; background: linear-gradient(160deg, #e3e8f3, #cfd8ea); } .pc b { display: block; font-size: 17px; } .pc span { color: #777; font-size: 14px; }
  .q { border-radius: 3px; }
  /* galutinė būsena (epizodai.js) — po pamokos CSS, kad visada laimėtų */
  .stage > .scr:nth-of-type(1) { opacity: 1; }
  .cursor-wrap { transform: translate(1496.0px, 397.0px); }
  .caret-sl { opacity: 1; }
  .profs { opacity: 1; }

</style>
</head>

          </div><div class="tvs-cke-body"><p>Administracija</p><p data-t="code">{{ staff(<span class="tvs-typed ty-sl" data-ty="sl"><span class="w"><span class="l l1">'</span><span class="l l2">a</span><span class="l l3">d</span><span class="l l4">m</span><span class="l l5">i</span><span class="l l6">n</span><span class="l l7">i</span><span class="l l8">s</span><span class="l l9">t</span><span class="l l10">r</span><span class="l l11">a</span><span class="l l12">c</span><span class="l l13">i</span><span class="l l14">j</span><span class="l l15">a</span><span class="l l16">'</span></span></span>) }}</p></div><div class="tvs-cke-bot"><span>body</span><span>p</span></div></div></div><div class="tvs-form-foot"><span class="tvs-btn is-tiny" data-t="upd"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Atnaujinti</span></div></div>
