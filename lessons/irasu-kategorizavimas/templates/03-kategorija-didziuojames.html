<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<link rel="stylesheet" href="./tokens/koncepcijos.css">
<!-- Generuoja koncepcijos.js iš platformos kortelės — ranka neredaguoti. -->
</head>
<body>
  <div class="card">
    
    <div class="k-stream"><div class="k-news is-ghost b-g1"><div class="k-news-img"></div><div class="k-news-b"><span class="k-news-l" style="width:80%"></span><span class="k-news-l" style="width:60%"></span><span class="k-news-l" style="width:70%"></span></div></div><div class="k-news b-card"><div class="k-news-img"><span class="k-cat-tag">{{title}}</span></div>
      <div class="k-news-b"><div class="k-cat-t b-kam">{{kam}}</div></div></div><div class="k-news is-ghost b-g2"><div class="k-news-img"></div><div class="k-news-b"><span class="k-news-l" style="width:80%"></span><span class="k-news-l" style="width:60%"></span><span class="k-news-l" style="width:70%"></span></div></div></div><div class="k-cat-r b-tais"><svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="16.5 9 10.5 15 7.5 12"/></svg><span>{{taisykle}}</span></div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="{{brand_logo_path}}" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="{{brand_logo_dark_path}}" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
