<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
  .card { padding: 30px 120px 30px; }
  .title { margin-bottom: 18px; }
  .phones { display: flex; justify-content: center; gap: 140px; }
  .col { position: relative; display: flex; flex-direction: column; align-items: center; }
  .lbl { font-size: 28px; font-weight: 700; margin-bottom: 14px; }
  .lbl-bad { color: var(--c-red-text); } .lbl-good { color: var(--c-green-text); }
  .ph { width: 498px; height: 820px; border-radius: 52px; background: #111827; padding: 14px; box-shadow: var(--c-shadow-card); }
  .ph-scr { width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background: #f2f2f2; font-family: 'Roboto', sans-serif; }
  .ph-head { display: block; width: 470px; }
  .ph-page { padding: 24px 24px; }
  .ph-h1 { font-size: 27px; font-weight: 700; color: #373737; margin: 4px 0 17px; }
  .ph-card { background: #fff; padding: 24px; }
  /* Word: lygiavimas per abu kraštus, pirmos eilutės atitraukimas, ranka sudėti brūkšneliai */
  .pb { font-family: Calibri, 'Times New Roman', serif; font-size: 24px; line-height: 1.35; color: #000; margin: 0 0 12px; }
  .pb-just { text-align: justify; text-indent: 40px; }
  .pg { font-size: 23px; line-height: 1.6; color: #5f5f5f; margin: 0 0 14px; }
  .pg-ul { margin: 0 0 0 28px; padding: 0; font-size: 23px; line-height: 1.6; color: #5f5f5f; }
  .pg-ul li { margin-bottom: 6px; }
  .call { position: absolute; font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; padding: 8px 16px; border-radius: 10px;
           white-space: nowrap; box-shadow: var(--c-shadow-card); }
  .call-gap, .call-dash { background: var(--c-red-bg); color: var(--c-red-text); border: 2px solid var(--c-red-solid); right: calc(100% + 22px); }
  .call-gap { top: 270px; } .call-dash { top: 440px; }
  .call-ok { background: var(--c-green-bg); color: var(--c-green-text); border: 2px solid var(--c-green-solid); left: calc(100% + 22px); top: 440px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">{{title}}</div>
    <div class="phones">
      <div class="col"><div class="lbl lbl-bad">{{l_lbl}}</div><div class="ph ph-bad"><div class="ph-scr"><img class="ph-head" src="assets/iklijuotas-mobili-antraste.png"><div class="ph-page"><div class="ph-h1">{{h1}}</div><div class="ph-card"><p class="pb pb-just">{{p_long}}</p><p class="pb pb-d">{{d1}}</p><p class="pb pb-d">{{d2}}</p></div></div></div></div>
        <span class="call call-gap">{{c_gap}}</span><span class="call call-dash">{{c_dash}}</span></div>
      <div class="col"><div class="lbl lbl-good">{{r_lbl}}</div><div class="ph ph-good"><div class="ph-scr"><img class="ph-head" src="assets/iklijuotas-mobili-antraste.png"><div class="ph-page"><div class="ph-h1">{{h1}}</div><div class="ph-card"><p class="pg">{{p_long}}</p><ul class="pg-ul"><li>{{l1}}</li><li>{{l2}}</li></ul></div></div></div></div>
        <span class="call call-ok">{{c_ok}}</span></div>
    </div>
  </div>
</body>
</html>
