<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./tokens/tokens.css">
<link rel="stylesheet" href="./tokens/base.css">
<style>

  .lead { font-size: 26px; color: var(--c-text-muted); text-align: center; margin: -28px 0 62px;
          hyphens: auto; overflow-wrap: break-word; }
  .foot { font-size: 24px; color: var(--c-text-secondary); text-align: center; margin-top: 56px;
          hyphens: auto; overflow-wrap: break-word; }
  .cols { display: flex; gap: 56px; align-items: stretch; }
  .col { flex: 1; border-radius: 24px; padding: 48px; display: flex; flex-direction: column; }
  .col-do { background: var(--c-green-bg); border: 1.5px solid var(--c-green-border); }
  .col-dont { background: var(--c-red-bg); border: 1.5px solid var(--c-red-border); }
  .col-head { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
  .col-icon { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center;
              justify-content: center; flex-shrink: 0; }
  .col-do .col-icon { background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to)); }
  .col-dont .col-icon { background: linear-gradient(135deg, var(--c-red-gradient-from), var(--c-red-gradient-to)); }
  .col-icon svg { width: 36px; height: 36px; }
  .col-title { font-size: 28px; font-weight: 700; color: var(--c-text); }
  .shot { border-radius: 14px; overflow: hidden; border: 1.5px solid var(--c-border);
          background: var(--c-surface); position: relative; }
  .shot img { display: block; width: 100%; }
  .ring { position: absolute; border: 5px solid var(--c-green-solid); border-radius: 10px; }
  .note { font-size: 23px; margin-top: 30px; hyphens: auto; overflow-wrap: break-word; }
  .col-do .note { color: var(--c-green-text); }
  .col-dont .note { color: var(--c-red-text); }

  .steps { display: flex; gap: 40px; align-items: stretch; }
  .step { flex: 1; min-width: 340px; background: var(--c-surface); border: 1.5px solid var(--c-border);
          border-radius: 24px; padding: 48px 44px; }
  .step-num { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center;
              justify-content: center; color: #fff; font-size: 30px; font-weight: 700; margin-bottom: 28px; }
  .n1 { background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to)); }
  .n2 { background: linear-gradient(135deg, var(--c-blue-gradient-from), var(--c-blue-gradient-to)); }
  .n3 { background: linear-gradient(135deg, var(--c-green-gradient-from), var(--c-green-gradient-to)); }
  .step-label { font-size: 28px; font-weight: 700; color: var(--c-text); margin-bottom: 20px;
                hyphens: auto; overflow-wrap: break-word; }
  .step-desc { font-size: 24px; line-height: 1.5; color: var(--c-text-muted);
               hyphens: auto; overflow-wrap: break-word; }
  .arrow { display: flex; align-items: center; color: var(--c-line); flex-shrink: 0; }

</style>
</head>
<body>
  <div class="card">
    <div class="title">Vienos mokyklos pastaba pataiso visas</div>
    <div class="steps">
      <div class="step">
        <div class="step-num n1">1</div>
        <div class="step-label">Pastaba</div>
        <div class="step-desc">Ateina konkretus priekaištas jūsų svetainei.</div>
      </div>
      <div class="arrow"><svg width="46" height="26" viewBox="0 0 46 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13h40M32 4l10 9-10 9"/></svg></div>
      <div class="step">
        <div class="step-num n2">2</div>
        <div class="step-label">Persiunčiate</div>
        <div class="step-desc">Atsakome techniškai arba atnaujiname modulį.</div>
      </div>
      <div class="arrow"><svg width="46" height="26" viewBox="0 0 46 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13h40M32 4l10 9-10 9"/></svg></div>
      <div class="step">
        <div class="step-num n3">3</div>
        <div class="step-label">Pasiekia visus</div>
        <div class="step-desc">Pataisymas pasiekia visas mokyklas iš karto.</div>
      </div>
    </div>
    <div class="foot">Nežinoti, ką atsakyti, nieko blogo. Tam ir esame.</div>
    <div class="brand-bar">
      <img class="brand-logo brand-logo-light" src="./assets/cleverphant-juodas.svg" alt="Cleverphant" />
      <img class="brand-logo brand-logo-dark" src="./assets/cleverphant-baltas.png" alt="Cleverphant" />
    </div>
  </div>
</body>
</html>
