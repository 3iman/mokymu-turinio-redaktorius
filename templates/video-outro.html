<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  width: 1920px;
  height: 1080px;
  background-image: url('{{bg_image_path}}');
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 40px;
  position: relative;
}

.thanks {
  font-size: 64px;
  font-weight: 800;
  color: #ffffff;
  text-align: center;
  line-height: 1.2;
  letter-spacing: -0.5px;
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
}

.accent-line {
  width: 80px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.4);
}

.brand-name {
  font-size: 32px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.85);
  text-align: center;
  letter-spacing: 2px;
}

.url {
  font-size: 20px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.5);
  text-align: center;
  letter-spacing: 1px;
  position: absolute;
  bottom: 48px;
}
</style>
</head>
<body>
  <div class="card">
    <div class="thanks">{{outro_thanks}}</div>
    <div class="accent-line"></div>
    <div class="brand-name">CLEVERPHANT</div>
    <div class="url">www.cleverphant.lt</div>
  </div>
</body>
</html>
