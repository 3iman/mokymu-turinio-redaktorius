<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --sp: cubic-bezier(0.16, 1, 0.3, 1); }

  /* Tamsus atidarymas — pora firminei vinjetei pabaigoje.
     Tarp jų filmas šviesus, tad gaunasi arka, ne vienalytė juosta. */
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: Inter, -apple-system, sans-serif;
    background:
      radial-gradient(circle 470px at 86% 8%,  rgba(58,176,176,.18) 0 99%, rgba(58,176,176,0) 100%),
      radial-gradient(circle 220px at 5% 94%,  rgba(199,185,219,.16) 0 99%, rgba(199,185,219,0) 100%),
      radial-gradient(circle 90px  at 92% 86%, rgba(243,168,196,.30) 0 99%, rgba(243,168,196,0) 100%),
      linear-gradient(160deg, #0b1728 0%, #12203a 46%, #16264a 100%);
    position: relative;
  }

  .card { position: absolute; top: 50%; left: 140px; transform: translateY(-50%); width: 1500px; }

  .subtitle {
    font-size: 19px; font-weight: 700; letter-spacing: 3.6px; text-transform: uppercase;
    color: #6e86b5; margin-bottom: 28px;
  }
  .title {
    font-size: 86px; font-weight: 400; letter-spacing: -2.4px; line-height: 1.06; color: #fff;
    hyphens: auto; overflow-wrap: break-word;
  }
  .title b { display: block; font-weight: 800; }
  .accent-line {
    height: 5px; border-radius: 3px; width: 300px;
    background: linear-gradient(90deg, #3ab0b0, #f3a8c4); margin-top: 40px;
  }
  .url {
    position: absolute; left: 140px; bottom: 96px;
    font-size: 22px; font-weight: 600; letter-spacing: 1.6px; color: rgba(255,255,255,.55);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="subtitle">{{video_subtitle}}</div>
    <div class="title">{{video_title}}</div>
    <div class="accent-line"></div>
  </div>
  <div class="url">cleverphant.lt</div>
</body>
</html>
