<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #f0f2f5;
  }

  /* Simulate a clip ending */
  .clip-before {
    position: absolute;
    inset: 0;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: clipFadeOut 0.6s ease-in 1.5s forwards;
  }

  .clip-before-inner {
    width: 1680px;
    height: 920px;
    background: white;
    border-radius: 32px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #64748b;
    font-weight: 600;
  }

  @keyframes clipFadeOut {
    to { opacity: 0; }
  }

  /* Transition divider */
  .transition {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6, #6366f1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    opacity: 0;
    animation: transIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 2.1s forwards,
               transOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) 4.0s forwards;
  }

  .transition-number {
    font-size: 140px;
    font-weight: 800;
    color: white;
    letter-spacing: -4px;
    opacity: 0;
    transform: translateY(30px) scale(0.9);
    animation: numIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 2.4s forwards;
  }

  .transition-line {
    width: 80px;
    height: 4px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    opacity: 0;
    transform: scaleX(0);
    animation: lineIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 2.7s forwards;
  }

  .transition-title {
    font-size: 32px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.5px;
    opacity: 0;
    transform: translateY(10px);
    animation: titleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 2.9s forwards;
  }

  @keyframes transIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes transOut {
    to { opacity: 0; }
  }

  @keyframes numIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes lineIn {
    to { opacity: 1; transform: scaleX(1); }
  }

  @keyframes titleIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Next clip appearing */
  .clip-after {
    position: absolute;
    inset: 0;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: clipFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 4.5s forwards;
  }

  .clip-after-inner {
    width: 1680px;
    height: 920px;
    background: white;
    border-radius: 32px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #64748b;
    font-weight: 600;
  }

  /* Replay hint */
  .replay {
    position: fixed;
    bottom: 30px;
    right: 40px;
    font-size: 16px;
    color: #94a3b8;
    opacity: 0;
    animation: replayIn 0.3s ease 5.5s forwards;
  }

  @keyframes replayIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <!-- Previous clip fading out -->
  <div class="clip-before">
    <div class="clip-before-inner">
      04 &mdash; Kaip publikuoti failą
    </div>
  </div>

  <!-- Transition B: spalvinis kvėpavimas -->
  <div class="transition">
    <div class="transition-number">05</div>
    <div class="transition-line"></div>
    <div class="transition-title">Ką matote atidarę šabloną</div>
  </div>

  <!-- Next clip fading in -->
  <div class="clip-after">
    <div class="clip-after-inner">
      05 &mdash; Ką matote atidarę šabloną
    </div>
  </div>

  <div class="replay">Atnaujinkite puslapį, kad pakartotumėte</div>
</body>
</html>
